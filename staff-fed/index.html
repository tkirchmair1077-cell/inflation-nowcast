<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Desk</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Staff-style research desk. Public sources only. Not official central-bank staff work. Not investment advice.">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#f9fafc; --border:#e2e7ee; --border-strong:#cfd7e2;
  --text:#0f1c30; --text-2:#56657c; --text-3:#8391a6; --grid:#e8ecf2;
  --navy:#14305a; --navy-ink:#ffffff; --accent:#2f5d9e;
  --green:#2e8b5a; --green-bg:#e7f4ec; --red:#c4514c; --red-bg:#fbebea; --amber:#a9741a; --amber-bg:#fdf2d9; --neutral-bg:#eef1f5;
  --shadow:0 1px 2px rgba(15,28,48,.04);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0a111e; --surface:#111a2b; --surface-2:#0e1626; --border:#223149; --border-strong:#2f4262;
  --text:#e5ebf4; --text-2:#9aabc3; --text-3:#6f819b; --grid:#1d2a40;
  --navy:#3d6cb3; --navy-ink:#ffffff; --accent:#7ba5e6;
  --green:#4cc08a; --green-bg:#12301f; --red:#ec7b76; --red-bg:#3a1a1a; --amber:#e3b25a; --amber-bg:#33280f; --neutral-bg:#18233a;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-inner{display:flex;align-items:center;gap:20px;padding:14px 28px;max-width:1360px;margin:0 auto;flex-wrap:wrap}
.brand{flex:1 1 260px;min-width:200px}
.brand h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em;color:var(--text)}
.brand .sub{color:var(--text-2);font-size:12.5px;margin-top:2px}
.meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--text-2);font-size:12.5px}
.meta .lbl{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.meta .val{color:var(--text);font-weight:550}
.fresh{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--text-3);flex:none;box-shadow:0 0 0 3px rgba(128,140,160,.18)}
.dot.green{background:var(--green);box-shadow:0 0 0 3px rgba(46,139,90,.18)}
.dot.amber{background:#d9a21b;box-shadow:0 0 0 3px rgba(217,162,27,.2)}
.dot.red{background:var(--red);box-shadow:0 0 0 3px rgba(196,81,76,.2)}
.actions{display:flex;align-items:center;gap:10px}
button{font:inherit;cursor:pointer}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{background:var(--neutral-bg)}
.nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nav a{display:inline-flex;align-items:center;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:550;color:var(--text-2);text-decoration:none;border:1px solid transparent}
.nav a:hover{background:var(--neutral-bg);color:var(--text)}
.nav a.on{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.nav .sep{width:1px;height:16px;background:var(--border-strong);margin:0 4px}
.banner{background:var(--amber-bg);border-bottom:1px solid var(--amber);color:var(--text);font-weight:600;text-align:center;padding:9px 16px;font-size:13px;line-height:1.45}
.banner.stale{background:var(--amber-bg);color:var(--text)}
.banner.very-stale{background:var(--red-bg);border-bottom-color:var(--red);color:var(--text)}
.banner b{color:var(--amber)}
.banner.very-stale b{color:var(--red)}
main{padding:32px 0 20px}
section{margin-bottom:44px;scroll-margin-top:84px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-2);font-weight:650}
.sec-head .hint{color:var(--text-3);font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px}
.card h3{margin:0;font-size:15px;font-weight:620}
.card .sub{color:var(--text-2);font-size:12px}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ov-title{display:flex;flex-direction:column}
.ov-title b{font-size:13px;letter-spacing:.02em;color:var(--text-2);font-weight:620}
.ov-title span{font-size:11.5px;color:var(--text-3)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);background:var(--neutral-bg);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.badge.V,.badge.GREEN{color:var(--green);background:var(--green-bg);border-color:transparent}
.badge.V::before,.badge.GREEN::before{background:var(--green)}
.badge.U,.badge.YELLOW,.badge.WATCH{color:var(--amber);background:var(--amber-bg);border-color:transparent}
.badge.U::before,.badge.YELLOW::before,.badge.WATCH::before{background:#d9a21b}
.badge.d{color:var(--accent);background:var(--neutral-bg);border-color:transparent}
.badge.d::before{background:var(--accent)}
.badge.RED,.badge.stale{color:var(--red);background:var(--red-bg);border-color:transparent}
.badge.RED::before,.badge.stale::before{background:var(--red)}
.q{display:inline-flex;align-items:center;justify-content:center;min-width:22px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.q.V{background:var(--green-bg);color:var(--green)}
.q.U{background:var(--amber-bg);color:var(--amber)}
.q.d{background:var(--neutral-bg);color:var(--accent)}
.ov-col .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.ov-col .big{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.ov-col .big small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:3px;letter-spacing:0}
.ov-col .yy{color:var(--text-2);font-size:12.5px;margin-top:6px;line-height:1.45}
.legend-note{font-size:11.5px;color:var(--text-3);margin-top:10px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:650;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
td.num{font-weight:620;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.group td{background:var(--surface-2);font-weight:650;color:var(--text-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px}
.item-title{font-weight:620;color:var(--text)}
.item-rel{color:var(--text-2);font-size:12px;margin-top:3px;max-width:46rem;white-space:normal}
.notes{margin-top:10px;font-size:12px;color:var(--text-2);line-height:1.55}
.state-card{border-left:3px solid var(--navy)}
.state-card .state-text{margin:8px 0 0;font-size:14px;line-height:1.65;color:var(--text)}
.state-card .state-src{margin:10px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.5}
.staff-body{font-size:14px;line-height:1.65;margin:0}
.staff-body p{margin:0 0 12px}
.staff-body p:last-child{margin-bottom:0}
.staff-body ul{margin:0 0 14px;padding-left:18px}
.staff-body li{margin:0 0 6px}
.chart-img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--border);background:var(--surface-2)}
.cap-line{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.45}
.grid2 .card.wide{grid-column:1/-1}
.lead-block{margin-bottom:32px}
.lead-block:last-child{margin-bottom:0}
.lead-block-title{margin:0 0 8px;font-size:16px;font-weight:650;color:var(--text)}
.lead-read{margin:0 0 16px;font-size:14px;line-height:1.65;color:var(--text);max-width:58rem}
.lead-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.lead-grid .card.wide{grid-column:1/-1}
.lead-grid a.chart-link{display:block;color:inherit;text-decoration:none}
.lead-grid a.chart-link:hover .chart-img{border-color:var(--border-strong)}
.stale-note{border:1px solid var(--amber);background:var(--amber-bg);border-radius:8px;padding:8px 12px;font-size:12.5px;line-height:1.5;color:var(--text);margin:10px 0 0}
@media (max-width:1100px){
  .lead-grid{grid-template-columns:minmax(0,1fr)}
}
.chart-note{border:1px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:16px 20px;font-size:13.5px;line-height:1.65;color:var(--text);margin:0 0 18px}
.chart-note p{margin:0 0 8px}
.chart-note p:last-child{margin:0}
.chart-stats{margin-top:14px}
footer{margin:10px 0 48px}
.caveat{border:1px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:18px 22px;color:var(--text)}
.caveat h2{margin:0 0 8px;font-size:15px;color:var(--amber);letter-spacing:.01em}
.caveat h3{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.caveat ul{margin:0;padding-left:18px;font-size:13px;line-height:1.65}
.caveat .fine{margin-top:10px;font-size:11.5px;color:var(--text-2)}
.notice{color:var(--text-2);font-size:13px;text-align:center;padding:16px}
.muted{color:var(--text-2)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--neutral-bg);color:var(--text-2);white-space:nowrap}
.pill.pending{background:var(--amber-bg);color:var(--amber)}
.pill.missing{background:var(--red-bg);color:var(--red)}
.pill.stale{background:var(--red-bg);color:var(--red)}
.pill.retained,.pill.updated{background:var(--green-bg);color:var(--green)}
.pill.own{background:var(--neutral-bg);color:var(--accent)}
.site-foot{margin:16px 0 0;font-size:12px;color:var(--text-3);text-align:center;line-height:1.55}
.site-foot a{color:var(--accent);text-decoration:none}
.site-foot a:hover{text-decoration:underline}
.legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 12px;font-size:12px;color:var(--text-2)}
@media (max-width:1100px){
  .grid4,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding:0 14px}
  .top-inner{padding:12px 14px;gap:12px}
  .brand h1{font-size:18px}
  .meta{gap:14px;width:100%}
  main{padding-top:22px}
  .card{padding:16px}
  .ov-col .big{font-size:24px}
  .grid4,.grid3{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1 id="brandTitle">Staff Desk</h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="meta">
      <div><span class="lbl" id="lblAsOf">As of</span><span class="val" id="asOf">–</span></div>
      <div><span class="lbl" id="lblSrc">Source</span><span class="val" id="srcFile">–</span></div>
      <div class="fresh"><i class="dot amber" id="freshDot"></i><div><span class="lbl" id="lblFresh">Data freshness</span><span class="val" id="freshText">–</span></div></div>
    </div>
    <nav class="nav" id="nav" aria-label="Staff desks"></nav>
    <div class="actions">
      <button class="btn-ghost" id="themeBtn" type="button" aria-label="Toggle dark mode">◐ <span id="themeLbl">Dark</span></button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<main class="wrap" id="app">
  <section id="summary">
    <div class="sec-head"><h2 id="hSummary">1 · Current state</h2><span class="hint" id="hintQuality"></span></div>
    <div class="grid4" id="kpis"></div>
    <div class="card state-card" id="stateBox" style="margin-top:18px"></div>
  </section>

  <section id="staff">
    <div class="sec-head"><h2 id="hStaff">2 · Staff view</h2><span class="hint" id="hintStaff"></span></div>
    <div class="card">
      <div class="staff-body" id="staffBody"></div>
      <div class="tbl-wrap" id="taylorTbl" style="margin-top:16px"></div>
    </div>
  </section>

  <section id="leading" hidden>
    <div class="sec-head"><h2 id="hLeading">3 · Leading indicators</h2><span class="hint" id="hintLeading"></span></div>
    <div id="leadingBody"></div>
  </section>

  <section id="ust10y" hidden>
    <div class="sec-head"><h2 id="hUst10y">4 · 10Y Treasury: where the move comes from</h2><span class="hint" id="hintUst10y"></span></div>
    <div id="ust10yBody"></div>
  </section>

  <section id="nowcasts">
    <div class="sec-head"><h2 id="hNowcast">3 · Nowcasts</h2><span class="hint" id="hintNowcast"></span></div>
    <div class="legend-row" id="legend"></div>
    <div class="card">
      <div class="tbl-wrap" id="nowcastTbl"></div>
      <div class="notes" id="nowcastNote"></div>
    </div>
  </section>

  <section id="baseline">
    <div class="sec-head"><h2 id="hBaseline">4 · Baseline</h2><span class="hint" id="hintBaseline"></span></div>
    <div class="card">
      <div class="tbl-wrap" id="baselineTbl"></div>
      <div class="notes" id="baselineNote"></div>
    </div>
  </section>

  <section id="recent">
    <div class="sec-head"><h2 id="hRecent">5 · Key data since last update</h2><span class="hint" id="hintRecent"></span></div>
    <div class="card">
      <div class="tbl-wrap" id="recentTbl"></div>
      <div class="notes" id="recentNote"></div>
    </div>
  </section>

  <section id="calendar">
    <div class="sec-head"><h2 id="hCal">6 · Upcoming calendar</h2><span class="hint" id="hintCal"></span></div>
    <div class="card">
      <div class="tbl-wrap" id="calTbl"></div>
      <div class="notes" id="calNote"></div>
    </div>
  </section>

  <section id="charts" hidden>
    <div class="sec-head"><h2 id="hCharts">7 · Charts</h2><span class="hint" id="hintCharts"></span></div>
    <div class="chart-note" id="chartsNote" hidden></div>
    <div class="grid2" id="chartGrid"></div>
  </section>
</main>

<footer class="wrap">
  <div class="caveat" id="caveat">
    <h2 id="hCaveat">⚠ Datenlage und Quellen – Vorbehalte</h2>
    <div id="caveatBody"></div>
    <p class="fine" id="caveatFine"></p>
  </div>
  <div class="site-foot" id="siteFoot"></div>
</footer>

high.","Inflation (upside risk): October core CPI +0.3% m/m (BLS, V). The 3.2% core PCE Q4/Q4 baseline is retained, with judgmental upside risk of about 3.3–3.4% (own estimate), pending PPI on 13 Nov. Productivity and ECI still offset.","Credit / household finance: SLOOS (2 Nov) still shows weak C&I demand and tighter CRE and non-bank financial standards; SCE missed-payment probability 13.8% (V, 9 Nov). A Q3 credit-card 90+ delinquency reading of 12.9% remains U and was not re-verified.","Policy: hold-with-tightening-bias remains the central case; a December hike is live, not automatic (own estimate)."],"policy":"Keep hold at 3.75–4.00% with a tightening bias. Stronger payrolls and a still-firm core CPI make the December hike-live case more compelling; better unit labour costs and mixed labour internals keep it from being automatic. The core PCE baseline is not reset ahead of PPI. No new numerical decision probability is assigned. The staff path remains separate from the 16 Sep SEP. Market pricing — current Treasury yields, post-CPI moves and December hike odds — is n/a as a single verified series in this run. Target range 3.75–4.00%, held 10–2 on 28 Oct (Fed statement, V, carried from the 6 Nov Page).","taylor":{"title":"Taylor-type diagnostic (d)","note":"Carried from the 6 Nov Page; not recalculated on 12 Nov. Not optimal-policy estimates.","rows":[{"label":"Carried from the 6 Nov Page; not recalculated this run","inputs":"r* 1.2; u* 4.2 (SEP 16 Sep); u 4.1 (BLS Oct); gap +0.2 (d); π core 3.1 / headline 3.6 (BEA Sep, 29 Oct); midpoint 3.875 (Fed 28 Oct)","result":"6 Nov: core 4.95%; headline 5.70%; low-r* 4.25%; inertial 4.04%"}]}},"charts_hint":"Inflation-nowcast model backtest of 6 Nov 2026. Pseudo out-of-sample, current vintage (not real-time). Not a track record of the staff-judgment figures in the nowcast table.","charts":[{"file":"charts/us_cpi_nowcast_vs_actual_2026-11-06.png","wide":true,"title":"US CPI nowcast vs actual — pseudo out-of-sample backtest","subtitle":"Staff inflation-nowcast model, current vintage (not real-time). The chart shows 2018–September 2026; the error statistics are the full-sample figures from the already-produced 6 Nov 2026 backtest report (February 2005–September 2026, n=257). This is the model’s historical error, not a track record of the staff-judgment nowcasts in the table above.","caption":"Source: staff inflation-nowcast model, already-produced pseudo out-of-sample backtest (report label: current vintage, not real-time). As of 6 Nov 2026, 10:46 Europe/Zurich (report timestamp 2026-11-06T09:46:12Z). Actuals: BLS CPI, current vintage, seasonally adjusted, percent month-on-month. The chart is drawn from the already-produced step file; RMSE, MAE and related figures are taken from the already-produced backtest report (same rounding) and its summary JSON. No new model was estimated. This backtest uses revised history, not a real-time vintage. The model in this backtest is a univariate AR(1) on each component’s month-on-month SA series; in production the food component uses persistence and the energy component a gasoline bridge. The October 2025 CPI publication gap, and the non-adjacent November 2025 month, are skipped (shaded band, September 2025–January 2026). US headline model RMSE in the 2023+ sub-period was 0.209 (n=42), as in the same report. A quasi-real-time evaluation against first-release actuals was also produced on 6 Nov 2026, 10:00 Europe/Zurich: US headline RMSE 0.275, n=138. The backtest ends at September 2026 and does not include the October CPI released on 10 Nov. Quality of error statistics: (d).","stats":[{"series":"Headline, SA","n":"257","rmse":"0.291","mae":"0.194","rw_rmse":"0.323","seasonal_rmse":"0.348","dir_hit":"84.8%","cov80":"79.8%","unit":"pp m/m","quality":"(d)"},{"series":"Core, SA","n":"257","rmse":"0.113","mae":"0.076","rw_rmse":"0.120","seasonal_rmse":"0.151","dir_hit":"97.7%","cov80":"79.8%","unit":"pp m/m","quality":"(d)"},{"series":"Food, SA","n":"257","rmse":"0.209","mae":"0.150","rw_rmse":"0.222","seasonal_rmse":"0.294","dir_hit":"85.2%","cov80":"79.8%","unit":"pp m/m","quality":"(d)"},{"series":"Energy, SA","n":"257","rmse":"3.110","mae":"2.155","rw_rmse":"3.654","seasonal_rmse":"3.485","dir_hit":"59.9%","cov80":"79.8%","unit":"pp m/m","quality":"(d)"}],"note":"Units are percentage points, month-on-month, seasonally adjusted. Coverage of 80% uses full-sample error quantiles (informative, not expanding sequential bands), as stated in the backtest report."}],"charts_note":"","caveats":["Checked 12 Nov 2026, ~07:40 Europe/Zurich (CET). (d) = own derivation; own estimate = staff judgment; V = checked against a primary source this run or, for rounded BLS NFP, productivity and CPI figures, carried from the 6 Nov Page and the 10 Nov staff CPI draft (BLS pages not re-opened this morning); U = secondary or not independently re-checked.","MISSING: claims for the week ended 7 Nov (due 12 Nov, 14:30 Zurich). No New York Fed Staff Nowcast after 6 Nov in the official file. Current Treasury yields, a single verified December hike probability, and a reconciled post-CPI market reaction are n/a.","BLS published no October CPI year-on-year change (October 2025 gap). Unrounded CPI 0.350 / 0.296 (d) is carried from the 10 Nov staff draft’s API derivation, not re-fetched on 12 Nov.","The University of Michigan primary page does not timestamp the release; secondary news reports date it 6 Nov, not 9 Nov (U).","Q3 credit-card 90+ delinquency 12.9% remains U, not re-verified.","Atlanta GDPNow and the New York Fed Staff Nowcast are model outputs, not official FOMC forecasts. Taylor figures are carried, not recalculated, and are not optimal-policy estimates.","The US CPI nowcast-versus-actual chart and its error statistics come from the staff inflation-nowcast model’s already-produced pseudo out-of-sample backtest of 6 Nov 2026, 10:46 Europe/Zurich. That backtest uses revised (current-vintage) history, not a real-time vintage, and is not a track record of the staff-judgment nowcasts in the table. It ends at September 2026 and does not include the October CPI released on 10 Nov.","Leading-indicator charts on this page are as of 12 Nov 2026, 17:24 Europe/Zurich, from the Fed Staff Desk note leading_indicators_2026-11-12.md. They were not part of the 07:40 cutoff. Every chart carries a source credit and a “Shown without endorsement by …” line.","Several full-sample leads on the leading-indicator charts are driven by 2020–23. Where the pre-pandemic lead is the economically meaningful one and the full-sample best lag is contemporaneous under the 2020 spike, the chart is shifted by the pre-pandemic lead and says so. The 10-year minus 3-month Treasury spread is not shifted, because its linear correlation with quarterly real GDP growth is near zero (d).","The Chicago Fed National Financial Conditions Index (NFCI) and its nonfinancial-leverage subindex are shown as the latest vintage only (FRED vintage 12 Nov 2026). There is no real-time vintage test.","There is no October 2026 year-on-year figure for CPI (headline or core) or for import prices excluding fuels, because October 2025 is missing at source. Those gaps are not imputed and are hatched on the charts. The October 2026 import-price level was not in the 17:24 delivery.","The Richmond survey chart is a staff chart of the published manufacturing and non-manufacturing price series, plus an equal-weight staff construction (d) of prices received in months where both sectors exist. It is not an official index and is not given an official index name.","The 1-year expected inflation series is a Federal Reserve Bank of Cleveland model product (DOI: https://doi.org/10.26509/frbc-infexp), shown without endorsement by the Bank, for noncommercial use. This page charts only the published output.","The Atlanta Business Inflation Expectations (BIE) year-ahead unit-cost series is shown without endorsement by the Federal Reserve Bank of Atlanta, for noncommercial use.","The last initial-claims week on the labour leading-indicator charts, ended 7 Nov 2026 (weekly 200,000 and 4-week average 195,250), is an advance figure, scheduled to be revised on 19 November 2026. The morning note at 07:40 had recorded that week as still unpublished.","November 2026 monthly averages for the 5-year breakeven and the 10-year minus 3-month spread use n=7 trading days through 10 Nov (incomplete, d). The November NFCI and leverage averages use n=1 week (6 Nov).","Correlations on the leading-indicator charts are pairwise-complete Pearson (d) and are not a forecast evaluation. Correlation is not causation. Lead stability is not assumed.","10-year Treasury composition charts are from the Fed Staff Desk note ust10y_decomposition_charts_2026-11-12.md. H.15 and NY Fed ACM run through 10 November 2026; Board Kim-Wright through 6 November 2026. The tidy delivery was fetched at 06:47 Europe/Zurich on 13 November, after the 12 November 22:15 H.15 slot. 11 November was Veterans Day (Board closed; no H.15). Treasury’s own daily CSVs already show 12 November (nominal 5.10, real 2.86, difference 2.24) — a verified Research Manager figure, used here only as a caveat and not shown on the public charts.","The 10-year breakeven on every public composition chart is a staff calculation (d): DGS10 minus DFII10, same H.15 date and vintage. FRED T10YIE is not used. Research Manager verified that identity on all 5,969 common days, 2 January 2003–10 November 2026. The identity does not hold across mixed close dates.","The staff 10-year breakeven is inflation compensation, not pure expected inflation: it embeds an inflation risk premium and is affected by TIPS liquidity (and related frictions), as the Board’s TIPS-curve file (feds200805) states.","The NY Fed ACM model is re-estimated once a month, which “may result in minor changes to the historical decompositions of Treasury yields” (NY Fed product page). This vintage is the official Excel fetched 13 November 06:47 Europe/Zurich, daily through 10 November. The daily posting time is undocumented (U as an SLA; V as today’s last date). Do not present a revised history as if it had been known in real time.","Kim-Wright is weekly (Board: typically Tuesday, through the previous Friday). Last observation 6 November 2026, posted 10 November. The 1-day Kim-Wright panel is flagged STALE: the market 9–10 November window has no new KW data. KW is never extrapolated past 6 November. A KW 1-week or 1-month change is KW’s own window ending 6 November, which is not the same as the H.15 window ending 10 November (1-week: KW −8 bp vs H.15 +3 bp).","Term-premium model dependence: ACM 0.650% (10 November) vs Kim-Wright 0.874% (6 November) are different dates. On the last common date, 6 November, the gap is 0.643% vs 0.874%, or 23.1 bp (d). The two models are shown separately and are never averaged. Kim-Wright’s published term premium includes the convexity premium; ACM, as described in the Board Q&A, is a “pure” (ex-convexity) concept. Levels are not strictly comparable; changes are more nearly so, but that is the Board’s wording, not a claim tested here.","The Split B residual is a fitting / curve-basis residual (d), not a liquidity term. It is DGS10 minus the model’s fitted 10-year. DGS10 is a par CMT; ACM is a model fitted to the GSW curve; Kim-Wright is a fitted zero-coupon yield. The residual therefore mixes model fit, par-versus-zero (and on-the-run / H.15 versus the off-the-run GSW universe), and any compounding-convention difference. Compounding conventions for ACM and Kim-Wright were not stated in the file headers and remain unverified from these sources. Residual history is wide (ACM SD 23.7 bp; KW SD 14.6 bp): a quiet residual on one day is not a structural series."],"excluded":[{"item":"Third-party inflation nowcast model readings (including any comparison of CPI or PCE to those model values)","reason":"Licensed or restricted content is not shown on this public page."},{"item":"Survey-consensus figures and surprise-versus-consensus calculations","reason":"Consensus values are not published here."},{"item":"Secondary unofficial PCE estimates from private accounts","reason":"Unverified and conflicting; omitted."},{"item":"Private business-survey (PMI) figures","reason":"Licensed survey data are not shown on this public page."},{"item":"Licensed bank, broker and private-survey datasets","reason":"Internal-use or licensed material is not shown."},{"item":"A model-based 10-year expected-inflation and inflation-risk-premium companion chart","reason":"Held off this public page under the house rule (internal only)."}],"gaps":["Claims for the week ended 7 Nov were still unpublished at the 07:40 CET cutoff on 12 Nov.","Core PCE staff baseline awaits the 13 Nov PPI before any reset decision.","Market yields and December policy odds were not available as a single verified series in this run.","The inflation-nowcast model backtest on this page is dated 6 Nov 2026 and does not include the October CPI (released 10 Nov)."],"leading_indicators":{"hint":"Staff charts and staff reads versus the 6 Nov baseline. As of 12 Nov 2026, 17:24 Europe/Zurich. Source: leading_indicators_2026-11-12.md. Public sources only.","as_of":"2026-11-12T17:24:00+01:00","as_of_display":"12 Nov 2026, 17:24 Europe/Zurich","source":"leading_indicators_2026-11-12.md","blocks":[{"id":"inflation","title":"Inflation","read":"Mixed, not a clean easing versus the 6 Nov 3.2% core baseline. Market breakevens and BIE are softer than the baseline; Richmond survey prices and import prices are firmer; GSCPI is still tight but off its September high; Cleveland is near the baseline.","charts":[{"file":"charts/leading_gscpi.png","title":"NY Fed GSCPI (advanced 12 months, d) vs core PCE inflation","caption":"© 2026 Federal Reserve Bank of New York, Global Supply Chain Pressure Index (GSCPI), https://www.newyorkfed.org/research/policy/gscpi (accessed 12 November 2026; official xls 1998-01 to 2026-10). Shown without en his page or its conclusions. Accessed 13 November 2026 (ACM official Excel and H.15 in the 13 Nov 2026, 06:47 Europe/Zurich tidy delivery). Residual = DGS10 minus ACMY10 is a fitting / curve-basis residual (d), not a liquidity term (par CMT vs model-fitted yield; ACM is built on the GSW curve). The ACM model is re-estimated once a month (history can revise). Daily posting time is undocumented. Modifications (changes, residual) are the author's and are not attributable to the source (d). Staff-style chart, not an official Federal Reserve or FOMC product.","wide":true,"width":2666,"height":2040},{"file":"charts/ust10y_splitB_kw_waterfalls_1d_1w_1m.png","title":"Composition of the 10-year Treasury — Kim-Wright split (expected short + term premium)","caption":"Source: Federal Reserve Board H.15 via FRED (DGS10). Source: Board of Governors of the Federal Reserve System, Three-Factor Nominal Term Structure Model (Kim and Wright), feds200533, https://www.federalreserve.gov/data/three-factor-nominal-term-structure-model.htm (accessed 13 November 2026). This is a staff research product, not an official Board statistical release. Shown without endorsement by the Board of Governors of the Federal Reserve System. Any conclusions drawn here are the author's own and are not to be attributed to the Board or the Federal Reserve System. Kim-Wright is posted weekly (typically Tuesday, through the previous Friday). Expected average short rate = THREEFY10 minus THREEFYTP10 (d). Residual = DGS10 minus THREEFY10 is a fitting / curve-basis residual (d), not a liquidity term (par CMT vs fitted zero-coupon yield). KW term premium includes the convexity premium. Never extrapolated past the last Kim-Wright date. Modifications (changes, expected-short construction, residual) are the author's (d). Staff-style chart, not an official Federal Reserve or FOMC product.","wide":true,"width":2666,"height":1940,"stale":true,"note":"The 1-day Kim-Wright panel is flagged STALE: there is no new KW data in function qs(id){ return document.getElementById(id); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function qClass(q){
  const t = String(q || "").trim();
  if (t === "V") return "V";
  if (t === "U") return "U";
  return "d";
}
function qBadge(q){
  const t = String(q || "").trim() || "U";
  const cls = qClass(t);
  const label = (t === "(d)" || t === "d" || cls === "d") && t !== "V" && t !== "U" ? "(d)" : t;
  return `<span class="q ${cls}" title="Data quality">${esc(label)}</span>`;
}
function statusPill(s){
  if (!s) return "";
  const raw = String(s);
  const k = raw.toLowerCase();
  let cls = "";
  if (/(missing|fehlt|veraltet|stale)/.test(k)) cls = "missing";
  else if (/(pending|ausstehend)/.test(k)) cls = "pending";
  else if (/(retained|beibehalten|updated|aktualisiert)/.test(k)) cls = "retained";
  else if (/(own|urteil|schätzung|estimate)/.test(k)) cls = "own";
  return ` <span class="pill ${cls}">${esc(raw)}</span>`;
}
function fmtWhen(iso, lang){
  if (!iso) return "–";
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
    const [y,m,d] = iso.split("-");
    if (lang === "de") {
      const months = ["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];
      return `${Number(d)}. ${months[Number(m)-1]} ${y}`;
    }
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${Number(d)} ${months[Number(m)-1]} ${y}`;
  }
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const loc = lang === "de" ? "de-CH" : "en-GB";
  const fmt = new Intl.DateTimeFormat(loc, {
    timeZone: "Europe/Zurich",
    day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false
  });
  return fmt.format(d).replace(",", "") + " Europe/Zurich";
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  const lang = document.documentElement.lang === "de" ? "de" : "en";
  const L = I18N[lang];
  qs("themeLbl").textContent = t === "dark" ? L.light : L.dark;
}
function initTheme(){
  let t = "light";
  try { t = localStorage.getItem(THEME_KEY) || t; } catch(e){}
  setTheme(t);
}
function navHtml(desk, L){
  const items = [
    {href:"../", label:L.home, id:""},
    {href:"../ai-token/", label:L.ai, id:""},
    {sep:true},
    {href:"../staff/", label:L.staffHome, id:"staff"},
    {href:"../staff-fed/", label:"Fed", id:"fed"},
    {href:"../staff-ecb/", label:"ECB", id:"ecb"},
    {href:"../staff-boe/", label:"BoE", id:"boe"},
    {href:"../staff-boj/", label:"BoJ", id:"boj"},
    {href:"../staff-snb/", label:"SNB", id:"snb"}
  ];
  return items.map(it => {
    if (it.sep) return `<span class="sep"></span>`;
    const on = it.id && it.id === desk ? " on" : (it.id === "staff" && !desk ? " on" : "");
    return `<a class="${on.trim()}" href="${it.href}">${esc(it.label)}</a>`;
  }).join("");
}

function renderKpis(data){
  const rows = (data.nowcasts || []).filter(r => r.headline);
  const el = qs("kpis");
  if (!rows.length) { el.innerHTML = ""; return; }
  el.innerHTML = rows.map(r => `
    <div class="card ov-col">
      <div class="ov-head">
        <div class="ov-title"><b>${esc(r.kpi_label || r.variable)}</b><span>${esc(r.period || "")}</span></div>
        ${qBadge(r.quality)}
      </div>
      <div class="big">${esc(r.value)}${r.unit ? `<small>${esc(r.unit)}</small>` : ""}</div>
      <div class="yy">${esc(r.kpi_note || r.status || "")}</div>
    </div>`).join("");
}

function groupRows(rows, lang){
  const L = I18N[lang] || I18N.en;
  const order = ["GDP","inflation","labour","policy"];
  const groups = [];
  const seen = new Set();
  for (const key of order) {
    const g = rows.filter(r => r.category === key);
    if (g.length) { groups.push({key, label: L.category[key] || key, rows:g}); seen.add(key); }
  }
  const rest = rows.filter(r => !seen.has(r.category));
  if (rest.length) groups.push({key:"other", label:"", rows:rest});
  return groups;
}

function renderNowcasts(data, L, lang){
  const rows = data.nowcasts || [];
  if (!rows.length) { qs("nowcastTbl").innerHTML = `<p class="notice">${esc(L.empty)}</p>`; return; }
  const groups = groupRows(rows, lang);
  let html = `<table><thead><tr>
    <th>${esc(L.colVariable)}</th>
    <th class="r">${esc(L.colValue)}</th>
    <th>${esc(L.colPeriod)}</th>
    <th>${esc(L.colStatus)}</th>
    <th>${esc(L.colInterval)}</th>
    <th>${esc(L.colPrior)}</th>
    <th>${esc(L.colSource)}</th>
    <th>${esc(L.colRationale)}</th>
  </tr></thead><tbody>`;
  for (const g of groups) {
    if (g.label) html += `<tr class="group"><td colspan="8">${esc(g.label)}</td></tr>`;
    for (const r of g.rows) {
      html += `<tr>
        <td><div class="item-title">${esc(r.variable)}</div></td>
        <td class="num r">${esc(r.value)}${r.unit ? " " + esc(r.unit) : ""}${qBadge(r.quality)}</td>
        <td>${esc(r.period || "–")}</td>
        <td>${statusPill(r.status)}</td>
        <td>${esc(r.interval || "–")}</td>
        <td>${esc(r.prior || "–")}</td>
        <td><div>${esc(r.source || "–")}</div><div class="item-rel">${esc(r.as_of || "")}</div></td>
        <td><div class="item-rel">${esc(r.rationale || "")}</div></td>
      </tr>`;
    }
  }
  html += `</tbody></table>`;
  qs("nowcastTbl").innerHTML = html;
  qs("nowcastNote").textContent = data.nowcast_note || "";
}

function renderBaseline(data, L){
  const rows = data.baseline || [];
  const sec = qs("baseline");
  if (!rows.length) {
    qs("baselineTbl").innerHTML = `<p class="notice">${esc(L.emptyBase)}</p>`;
    qs("baselineNote").textContent = data.baseline_note || "";
    return;
  }
  let html = `<table><thead><tr>
    <th>${esc(L.colVariable)}</th>
    <th class="r">${esc(L.colStaff)}</th>
    <th class="r">${esc(L.colPrev)}</th>
    <th class="r">${esc(L.colChange)}</th>
    <th class="r">${esc(L.colOfficial)}</th>
    <th>${esc(L.colSource)}</th>
  </tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr>
      <td><div class="item-title">${esc(r.variable)}</div></td>
      <td class="num r">${esc(r.staff || "–")}${qBadge(r.quality || "d")}</td>
      <td class="r">${esc(r.previous || "–")}</td>
      <td class="r">${esc(r.change || "–")}</td>
      <td class="r">${esc(r.official || "–")}</td>
      <td><div>${esc(r.source || "–")}</div><div class="item-rel">${esc(r.as_of || "")}</div></td>
    </tr>`;

  html += `</tbody></table>`;
  qs("baselineTbl").innerHTML = html;
  qs("baselineNote").textContent = data.baseline_note || "";
}

function renderRecent(data, L){
  const rows = data.recent_data || [];
  if (!rows.length) { qs("recentTbl").innerHTML = `<p class="notice">${esc(L.empty)}</p>`; return; }
  let html = `<table><thead><tr>
    <th>${esc(L.colRelease)}</th>
    <th>${esc(L.colActual)}</th>
    <th>${esc(L.colPrior)}</th>
    <th>${esc(L.colWhy)}</th>
  </tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr>
      <td><div class="item-title">${esc(r.release)}</div><div class="item-rel">${esc(r.date || "")}${r.quality ? qBadge(r.quality) : ""}</div></td>
      <td>${esc(r.actual || "–")}</td>
      <td>${esc(r.prior || "–")}</td>
      <td><div class="item-rel">${esc(r.why || "")}</div></td>
    </tr>`;
  }
  html += `</tbody></table>`;
  qs("recentTbl").innerHTML = html;

function renderCal(data, L){
  const rows = data.calendar || [];
  if (!rows.length) { qs("calTbl").innerHTML = `<p class="notice">${esc(L.emptyCal)}</p>`; return; }
  let html = `<table><thead><tr>
    <th>${esc(L.colDate)}</th>
    <th>${esc(L.colEvent)}</th>
    <th>${esc(L.colTime)}</th>
    <th>${esc(L.colFocus)}</th>
  </tr></thead><tbody>`;
  for (const r of rows) {
    html += `<tr>
      <td class="num">${esc(r.date)}</td>
      <td><div class="item-title">${esc(r.event)}</div></td>
      <td>${esc(r.time || "–")}</td>
      <td><div class="item-rel">${esc(r.why || "")}</div></td>
    </tr>`;
  }
  html += `</tbody></table>`;
  qs("calTbl").innerHTML = html;
  qs("calNote").textContent = data.calendar_note || "";

function renderStaff(data){
  const sv = data.staff_view || {};
  let html = "";
  if (sv.lead) html += `<p>${esc(sv.lead)}</p>`;
  if (sv.bullets && sv.bullets.length) {
    html += "<ul>" + sv.bullets.map(b => `<li>${esc(b)}</li>`).join("") + "</ul>";
  }
  if (sv.policy) html += `<p>${esc(sv.policy)}</p>`;
  qs("staffBody").innerHTML = html || `<p class="muted">–</p>`;
  const t = sv.taylor;
  if (t && (t.rows || t.note || t.result)) {
    let th = `<table><thead><tr><th>${esc(t.title || "Taylor-type diagnostic (d)")}</th><th>Assumptions / inputs</th><th class="r">Result</th></tr></thead><tbody>`;
    const rows = t.rows || [{inputs: t.assumptions || "", result: t.result || ""}];
    for (const r of rows) {
      th += `<tr><td>${esc(r.label || t.note || "Own calculation, not an optimal-policy estimate")}</td><td>${esc(r.inputs || t.assumptions || "")}</td><td class="r">${esc(r.result || t.result || "")}${qBadge("d")}</td></tr>`;
    }
    th += `</tbody></table>`;
    qs("taylorTbl").innerHTML = th;
  } else {
    qs("taylorTbl").innerHTML = "";
  }
}

function renderChartStats(c, L){
  const rows = c.stats || [];
  if (!rows.length) return "";
  const cols = [
    ["series", L.colVariable],
    ["n", L.colN],
    ["rmse", L.colRmse],
    ["mae", L.colMae],
    ["rw_rmse", L.colRw],
    ["seasonal_rmse", L.colSeas],
    ["dir_hit", L.colDir],
    ["cov80", L.colCov],
    ["unit", L.colUnit]
  ];
  const used = cols.filter(([k]) => rows.some(r => r[k] != null && r[k] !== ""));
  let html = `<div class="tbl-wrap chart-stats"><table><thead><tr>`;
  for (const [,lab] of used) html += `<th>${esc(lab)}</th>`;
  html += `</tr></thead><tbody>`;
  for (const r of rows) {
    html += "<tr>";
    for (const [k] of used) {
      const cls = k === "series" ? "" : " class=\"r\"";
      html += `<td${cls}>${esc(r[k] ?? "")}${k==="rmse" && r.quality ? qBadge(r.quality) : ""}</td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table></div>";
  return html;
}

function renderCharts(data, L){
  const charts = data.charts || [];
  const note = data.charts_note || "";
  const sec = qs("charts");
  if (!charts.length && !note) { sec.hidden = true; return; }
  sec.hidden = false;
  qs("chartGrid").innerHTML = charts.map(c => {
    const img = c.file ? `<img class="chart-img" src="${esc(c.file)}" alt="${esc(c.title)}" width="1600" height="900">` : "";
    const sub = c.subtitle ? `<div class="sub" style="margin:4px 0 12px">${esc(c.subtitle)}</div>` : "";
    const cap = c.caption ? `<div class="cap-line">${esc(c.caption)}</div>` : "";
    const cnote = c.note ? `<div class="notes">${esc(c.note)}</div>` : "";
    return `<div class="card${c.wide ? " wide" : ""}">
      <h3>${esc(c.title || "")}</h3>
      ${sub}${img}${renderChartStats(c, L)}${cnote}${cap}
    </div>`;
  }).join("");
  const noteEl = qs("chartsNote");
  if (note) {
    noteEl.hidden = false;
    const paras = String(note).split("\n").filter(Boolean);
    noteEl.innerHTML = paras.map(p => `<p>${esc(p)}</p>`).join("");
  } else {
    noteEl.hidden = true;
    noteEl.innerHTML = "";
  }
}

function chartCard(c, L){
  const title = c.title || "";
  const w = c.width || 2400;
  const h = c.height || 1650;
  const img = c.file
    ? `<a class="chart-link" href="${esc(c.file)}" target="_blank" rel="noopener"><img class="chart-img" src="${esc(c.file)}" alt="${esc(title)}" width="${esc(w)}" height="${esc(h)}" loading="lazy"></a>`
    : "";
  const cap = c.caption ? `<div class="cap-line">${esc(c.caption)}</div>` : "";
  const cnote = c.note ? `<div class="${c.stale ? "stale-note" : "notes"}">${esc(c.note)}</div>` : "";
  const kind = c.companion ? ` <span class="pill">${esc(L.companion || "Companion")}</span>` : "";
  const stale = c.stale ? ` <span class="pill pending">STALE</span>` : "";
  return `<div class="card${c.wide ? " wide" : ""}">
    <h3>${esc(title)}${kind}${stale}</h3>
    ${img}${cnote}${cap}
  </div>`;
}

function renderBlockSection(secId, bodyId, hintId, bundle, L){
  const sec = qs(secId);
  if (!bundle || !(bundle.blocks && bundle.blocks.length) && !bundle.read) {
    sec.hidden = true;
    return;
  }
  sec.hidden = false;
  qs(hintId).textContent = bundle.hint || "";
  const intro = bundle.read
    ? `<p class="lead-read">${esc(bundle.read)}</p>`
    : (bundle.note ? `<p class="notes" style="margin:0 0 18px">${esc(bundle.note)}</p>` : "");
  const blocks = (bundle.blocks || []).map(b => {
    const bid = b.id ? ` id="${esc(secId)}-${esc(b.id)}"` : "";
    const read = b.read ? `<p class="lead-read">${esc(b.read)}</p>` : "";
    const grid = `<div class="lead-grid">` + (b.charts || []).map(c => chartCard(c, L)).join("") + `</div>`;
    return `<div class="lead-block"${bid}>
      <h3 class="lead-block-title">${esc(b.title || "")}</h3>
      ${read}${grid}
    </div>`;
  }).join("");
  qs(bodyId).innerHTML = intro + blocks;
}

function renderLeading(data, L){
  const li = data.leading_indicators;
  const sec = qs("leading");
  if (!li || !(li.blocks && li.blocks.length)) {
    sec.hidden = true;
    sec.removeAttribute("aria-label");
    return;
  }
  sec.hidden = false;
  qs("hintLeading").textContent = li.hint || "";
  const intro = li.note ? `<p class="notes" style="margin:0 0 18px">${esc(li.note)}</p>` : "";
  qs("leadingBody").innerHTML = intro + li.blocks.map(b => {
    const bid = b.id ? ` id="leading-${esc(b.id)}"` : "";
    const read = b.read ? `<p class="lead-read">${esc(b.read)}</p>` : "";
    const grid = `<div class="lead-grid">` + (b.charts || []).map(c => chartCard(c, L)).join("") + `</div>`;
    return `<div class="lead-block"${bid}>
      <h3 class="lead-block-title">${esc(b.title || "")}</h3>
      ${read}${grid}
    </div>`;
  }).join("");
}

function renderCaveats(data, L){
  const bits = [];
  const caveats = data.caveats || [];
  if (caveats.length) {
    bits.push("<ul>" + caveats.map(c => `<li>${esc(c)}</li>`).join("") + "</ul>");
  }
  const excl = data.excluded || [];
  if (excl.length) {
    bits.push(`<h3>${esc(L.excluded)}</h3><ul>` + excl.map(e => {
      const item = typeof e === "string" ? e : e.item;
      const reason = typeof e === "string" ? "" : e.reason;
      return `<li>${esc(item)}${reason ? " — " + esc(reason) : ""}</li>`;
    }).join("") + "</ul>");
  }
  const gaps = data.gaps || [];
  if (gaps.length) {
    bits.push(`<h3>${esc(L.gaps)}</h3><ul>` + gaps.map(g => `<li>${esc(g)}</li>`).join("") + "</ul>");
  }
  qs("caveatBody").innerHTML = bits.join("") || `<p>${esc(L.empty)}</p>`;
  qs("caveatFine").textContent = L.fine;
}

function render(data){
  const lang = data.lang === "de" ? "de" : "en";
  document.documentElement.lang = lang;
  const L = I18N[lang];
  document.title = data.title || data.bot?.name || "Staff Desk";
  qs("brandTitle").textContent = data.short_title || data.bot?.name || "Staff Desk";
  qs("brandSub").textContent = data.subtitle || "";
  qs("lblAsOf").textContent = L.asOf;
  qs("lblSrc").textContent = L.source;
  qs("lblFresh").textContent = L.freshness;
  qs("asOf").textContent = data.as_of_display || fmtWhen(data.as_of, lang);
  qs("srcFile").textContent = (data.source && data.source.label) || "–";
  const fr = data.freshness || {};
  qs("freshText").textContent = fr.label || "–";
  qs("freshDot").className = "dot " + (fr.dot || "amber");
  const banner = qs("banner");
  if (fr.banner) {
    banner.hidden = false;
    banner.className = "banner " + (fr.dot === "red" ? "very-stale" : "stale");
    banner.innerHTML = fr.banner;
  } else {
    banner.hidden = true;
  }
  qs("nav").innerHTML = navHtml(data.desk, L);
  const theme = document.documentElement.getAttribute("data-theme") || "light";
  qs("themeLbl").textContent = theme === "dark" ? L.light : L.dark;

  qs("hSummary").textContent = L.summary;
  qs("hNowcast").textContent = L.nowcast;
  qs("hBaseline").textContent = L.baseline;
  qs("hRecent").textContent = L.recent;
  qs("hCal").textContent = L.cal;
  qs("hStaff").textContent = L.staff;
  qs("hCharts").textContent = L.charts;
  qs("hCaveat").textContent = L.caveat;
  qs("hintQuality").textContent = L.qualityHint;
  qs("hintNowcast").textContent = data.nowcast_hint || "";
  qs("hintBaseline").textContent = data.baseline_hint || "";
  qs("hintRecent").textContent = data.recent_hint || "";
  qs("hintCal").textContent = data.calendar_hint || "";
  qs("hintStaff").textContent = data.staff_hint || "";
  qs("hintCharts").textContent = data.charts_hint || "";
  qs("hintLeading").textContent = (data.leading_indicators && data.leading_indicators.hint) || "";
  qs("hintUst10y").textContent = (data.ust10y_decomposition && data.ust10y_decomposition.hint) || "";

  const hasLeading = !!(data.leading_indicators && (data.leading_indicators.blocks || []).length);
  const hasUst = !!(data.ust10y_decomposition && ((data.ust10y_decomposition.blocks || []).length || data.ust10y_decomposition.read));
  if (hasLeading || hasUst) {
    const labels = lang === "de"
      ? { leading:"Leitindikatoren", ust10y:"10J-Treasury: woher die Bewegung kommt",
          nowcast:"Nowcasts", baseline:"Ausgangslage", recent:"Daten seit dem letzten Stand",
          cal:"Kalender", charts:"Grafiken" }
      : { leading:"Leading indicators", ust10y:"10Y Treasury: where the move comes from",
          nowcast:"Nowcasts", baseline:"Baseline", recent:"Key data since last update",
          cal:"Upcoming calendar", charts:"Charts" };
    const seq = [];
    if (hasLeading) seq.push(["hLeading", labels.leading]);
    if (hasUst) seq.push(["hUst10y", labels.ust10y]);
    seq.push(["hNowcast", labels.nowcast], ["hBaseline", labels.baseline],
             ["hRecent", labels.recent], ["hCal", labels.cal], ["hCharts", labels.charts]);
    // Current state and Staff view stay 1 and 2; extra sections start at 3.
    seq.forEach((pair, i) => { qs(pair[0]).textContent = `${i + 3} · ${pair[1]}`; });
  }

  qs("legend").innerHTML = `
    <span class="q V">V</span> ${esc(L.legendV)}
    <span class="q U">U</span> ${esc(L.legendU)}
    <span class="q d">(d)</span> ${esc(L.legendD)}
    <span class="pill own">${esc(L.legendOwn)}</span>`;

  renderKpis(data);
  const sum = data.summary || {};
  qs("stateBox").innerHTML = `
    <div class="ov-head">
      <div class="ov-title"><b>${esc(sum.heading || (lang==="de" ? "Aktueller Stand" : "Current state"))}</b>
      <span>${esc(sum.source || "")}</span></div>
    </div>
    <div class="state-text">${esc(sum.text || "")}</div>
    <div class="state-src">${esc(sum.as_of ? (lang==="de"?"Stand: ":"As of: ") + (data.as_of_display || fmtWhen(sum.as_of, lang)) : "")}</div>`;

  renderNowcasts(data, L, lang);
  renderBaseline(data, L);
  renderRecent(data, L);
  renderCal(data, L);
  renderStaff(data);
  renderCharts(data, L);
  renderLeading(data, L);
  renderBlockSection("ust10y", "ust10yBody", "hintUst10y", data.ust10y_decomposition, L);
  renderCaveats(data, L);

  const home = `<a href="../">${esc(L.home)}</a> · <a href="../ai-token/">${esc(L.ai)}</a> · <a href="../staff/">${esc(L.staffHome)}</a>`;
  qs("siteFoot").innerHTML = `${esc(L.foot)} · ${home}`;
}

async function load(){
  let data = EMBEDDED;
  try {
    const r = await fetch("data/desk.json", {cache:"no-store"});
    if (r.ok) data = await r.json();
  } catch (e) {}
  if (!data) {
    qs("app").innerHTML = `<p class="notice">No desk data loaded.</p>`;
    return;
  }
  render(data);
}
qs("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  setTheme(cur === "dark" ? "light" : "dark");
});
initTheme();
load();
</script>
