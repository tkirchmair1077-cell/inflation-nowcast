<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Staff Desk</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<meta name="description" content="Staff-style research desk. Public sources only. Not official central-bank staff work. Not investment advice.">
<style>
:root{
  --bg:#f5f7fa; --surface:#ffffff; --surface-2:#f9fafc; --border:#e2e7ee; --border-strong:#cfd7e2;
  --text:#0f1c30; --text-2:#56657c; --text-3:#8391a6; --grid:#e8ecf2;
  --navy:#14305a; --navy-ink:#ffffff; --accent:#2f5d9e;
  --green:#2e8b5a; --green-bg:#e7f4ec; --red:#c4514c; --red-bg:#fbebea; --amber:#a9741a; --amber-bg:#fdf2d9; --neutral-bg:#eef1f5;
  --shadow:0 1px 2px rgba(15,28,48,.04);
  --font:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
html[data-theme="dark"]{
  --bg:#0a111e; --surface:#111a2b; --surface-2:#0e1626; --border:#223149; --border-strong:#2f4262;
  --text:#e5ebf4; --text-2:#9aabc3; --text-3:#6f819b; --grid:#1d2a40;
  --navy:#3d6cb3; --navy-ink:#ffffff; --accent:#7ba5e6;
  --green:#4cc08a; --green-bg:#12301f; --red:#ec7b76; --red-bg:#3a1a1a; --amber:#e3b25a; --amber-bg:#33280f; --neutral-bg:#18233a;
  --shadow:none;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:84px}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:14px;line-height:1.5;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased}
.wrap{max-width:1360px;margin:0 auto;padding:0 28px}
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.top-inner{display:flex;align-items:center;gap:20px;padding:14px 28px;max-width:1360px;margin:0 auto;flex-wrap:wrap}
.brand{flex:1 1 260px;min-width:200px}
.brand h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em;color:var(--text)}
.brand .sub{color:var(--text-2);font-size:12.5px;margin-top:2px}
.meta{display:flex;align-items:center;gap:18px;flex-wrap:wrap;color:var(--text-2);font-size:12.5px}
.meta .lbl{display:block;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3)}
.meta .val{color:var(--text);font-weight:550}
.fresh{display:flex;align-items:center;gap:8px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--text-3);flex:none;box-shadow:0 0 0 3px rgba(128,140,160,.18)}
.dot.green{background:var(--green);box-shadow:0 0 0 3px rgba(46,139,90,.18)}
.dot.amber{background:#d9a21b;box-shadow:0 0 0 3px rgba(217,162,27,.2)}
.dot.red{background:var(--red);box-shadow:0 0 0 3px rgba(196,81,76,.2)}
.actions{display:flex;align-items:center;gap:10px}
button{font:inherit;cursor:pointer}
.btn-ghost{background:transparent;color:var(--text);border:1px solid var(--border-strong);border-radius:8px;padding:9px 12px;font-size:13px;display:inline-flex;align-items:center;gap:6px}
.btn-ghost:hover{background:var(--neutral-bg)}
.nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.nav a{display:inline-flex;align-items:center;padding:6px 11px;border-radius:8px;font-size:12.5px;font-weight:550;color:var(--text-2);text-decoration:none;border:1px solid transparent}
.nav a:hover{background:var(--neutral-bg);color:var(--text)}
.nav a.on{background:var(--navy);color:var(--navy-ink);border-color:transparent}
.nav .sep{width:1px;height:16px;background:var(--border-strong);margin:0 4px}
.banner{background:var(--amber-bg);border-bottom:1px solid var(--amber);color:var(--text);font-weight:600;text-align:center;padding:9px 16px;font-size:13px;line-height:1.45}
.banner.stale{background:var(--amber-bg);color:var(--text)}
.banner.very-stale{background:var(--red-bg);border-bottom-color:var(--red);color:var(--text)}
.banner b{color:var(--amber)}
.banner.very-stale b{color:var(--red)}
main{padding:32px 0 20px}
section{margin-bottom:44px;scroll-margin-top:84px}
.sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.sec-head h2{margin:0;font-size:13px;letter-spacing:.09em;text-transform:uppercase;color:var(--text-2);font-weight:650}
.sec-head .hint{color:var(--text-3);font-size:12px}
.grid4{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow);padding:20px}
.card h3{margin:0;font-size:15px;font-weight:620}
.card .sub{color:var(--text-2);font-size:12px}
.ov-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.ov-title{display:flex;flex-direction:column}
.ov-title b{font-size:13px;letter-spacing:.02em;color:var(--text-2);font-weight:620}
.ov-title span{font-size:11.5px;color:var(--text-3)}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:650;padding:3px 9px;border-radius:999px;border:1px solid var(--border-strong);color:var(--text-2);background:var(--neutral-bg);white-space:nowrap}
.badge::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--text-3)}
.badge.V,.badge.GREEN{color:var(--green);background:var(--green-bg);border-color:transparent}
.badge.V::before,.badge.GREEN::before{background:var(--green)}
.badge.U,.badge.YELLOW,.badge.WATCH{color:var(--amber);background:var(--amber-bg);border-color:transparent}
.badge.U::before,.badge.YELLOW::before,.badge.WATCH::before{background:#d9a21b}
.badge.d{color:var(--accent);background:var(--neutral-bg);border-color:transparent}
.badge.d::before{background:var(--accent)}
.badge.RED,.badge.stale{color:var(--red);background:var(--red-bg);border-color:transparent}
.badge.RED::before,.badge.stale::before{background:var(--red)}
.q{display:inline-flex;align-items:center;justify-content:center;min-width:22px;font-size:10px;font-weight:700;padding:1px 5px;border-radius:4px;margin-left:6px;vertical-align:1px;letter-spacing:.02em}
.q.V{background:var(--green-bg);color:var(--green)}
.q.U{background:var(--amber-bg);color:var(--amber)}
.q.d{background:var(--neutral-bg);color:var(--accent)}
.ov-col .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);margin-bottom:4px}
.ov-col .big{font-size:28px;font-weight:650;letter-spacing:-.02em;line-height:1.1}
.ov-col .big small{font-size:13px;font-weight:500;color:var(--text-2);margin-left:3px;letter-spacing:0}
.ov-col .yy{color:var(--text-2);font-size:12.5px;margin-top:6px;line-height:1.45}
.legend-note{font-size:11.5px;color:var(--text-3);margin-top:10px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--text-3);font-weight:650;text-align:left;padding:8px 12px;border-bottom:1px solid var(--border-strong);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
td.r,th.r{text-align:right;white-space:nowrap}
td.num{font-weight:620;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.group td{background:var(--surface-2);font-weight:650;color:var(--text-2);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:7px 12px}
.item-title{font-weight:620;color:var(--text)}
.item-rel{color:var(--text-2);font-size:12px;margin-top:3px;max-width:46rem;white-space:normal}
.notes{margin-top:10px;font-size:12px;color:var(--text-2);line-height:1.55}
.state-card{border-left:3px solid var(--navy)}
.state-card .state-text{margin:8px 0 0;font-size:14px;line-height:1.65;color:var(--text)}
.state-card .state-src{margin:10px 0 0;font-size:11.5px;color:var(--text-3);line-height:1.5}
.staff-body{font-size:14px;line-height:1.65;margin:0}
.staff-body p{margin:0 0 12px}
.staff-body p:last-child{margin-bottom:0}
.staff-body ul{margin:0 0 14px;padding-left:18px}
.staff-body li{margin:0 0 6px}
.chart-img{display:block;width:100%;height:auto;border-radius:8px;border:1px solid var(--border);background:var(--surface-2)}
.cap-line{font-size:11.5px;color:var(--text-3);margin-top:8px;line-height:1.45}
.grid2 .card.wide{grid-column:1/-1}
.lead-block{margin-bottom:32px}
.lead-block:last-child{margin-bottom:0}
.lead-block-title{margin:0 0 8px;font-size:16px;font-weight:650;color:var(--text)}
.lead-read{margin:0 0 16px;font-size:14px;line-height:1.65;color:var(--text);max-width:58rem}
.lead-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.lead-grid .card.wide{grid-column:1/-1}
.lead-grid a.chart-link{display:block;color:inherit;text-decoration:none}
.lead-grid a.chart-link:hover .chart-img{border-color:var(--border-strong)}
.stale-note{border:1px solid var(--amber);background:var(--amber-bg);border-radius:8px;padding:8px 12px;font-size:12.5px;line-height:1.5;color:var(--text);margin:10px 0 0}
@media (max-width:1100px){
  .lead-grid{grid-template-columns:minmax(0,1fr)}
}
.chart-note{border:1px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:16px 20px;font-size:13.5px;line-height:1.65;color:var(--text);margin:0 0 18px}
.chart-note p{margin:0 0 8px}
.chart-note p:last-child{margin:0}
.chart-stats{margin-top:14px}
footer{margin:10px 0 48px}
.caveat{border:1px solid var(--amber);background:var(--amber-bg);border-radius:12px;padding:18px 22px;color:var(--text)}
.caveat h2{margin:0 0 8px;font-size:15px;color:var(--amber);letter-spacing:.01em}
.caveat h3{margin:16px 0 6px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--amber)}
.caveat ul{margin:0;padding-left:18px;font-size:13px;line-height:1.65}
.caveat .fine{margin-top:10px;font-size:11.5px;color:var(--text-2)}
.notice{color:var(--text-2);font-size:13px;text-align:center;padding:16px}
.muted{color:var(--text-2)}
.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:650;padding:2px 8px;border-radius:999px;background:var(--neutral-bg);color:var(--text-2);white-space:nowrap}
.pill.pending{background:var(--amber-bg);color:var(--amber)}
.pill.missing{background:var(--red-bg);color:var(--red)}
.pill.stale{background:var(--red-bg);color:var(--red)}
.pill.retained,.pill.updated{background:var(--green-bg);color:var(--green)}
.pill.own{background:var(--neutral-bg);color:var(--accent)}
.site-foot{margin:16px 0 0;font-size:12px;color:var(--text-3);text-align:center;line-height:1.55}
.site-foot a{color:var(--accent);text-decoration:none}
.site-foot a:hover{text-decoration:underline}
.legend-row{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin:0 0 12px;font-size:12px;color:var(--text-2)}
@media (max-width:1100px){
  .grid4,.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding:0 14px}
  .top-inner{padding:12px 14px;gap:12px}
  .brand h1{font-size:18px}
  .meta{gap:14px;width:100%}
  main{padding-top:22px}
  .card{padding:16px}
  .ov-col .big{font-size:24px}
  .grid4,.grid3{grid-template-columns:minmax(0,1fr)}
}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand">
      <h1 id="brandTitle">Staff Desk</h1>
      <div class="sub" id="brandSub"></div>
    </div>
    <div class="meta">
      <div><span class="lbl" id="lblAsOf">As of</span><span class="val" id="asOf">–</span></div>
      <div><span class="lbl" id="lblSrc">Source</span><span class="val" id="srcFile">–</span></div>
      <div class="fresh"><i class="dot amber" id="freshDot"></i><div><span class="lbl" id="lblFresh">Data freshness</span><span class="val" id="freshText">–</span></div></div>
    </div>
    <nav class="nav" id="nav" aria-label="Staff desks"></nav>
    <div class="actions">
      <button class="btn-ghost" id="themeBtn" type="button" aria-label="Toggle dark mode">◐ <span id="themeLbl">Dark</span></button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>

<main class="wrap" id="app">
  <section id="summary">
    <div class="sec-head"><h2 id="hSummary">1 · Current state</h2><span class="hint" id="hintQuality"></span></div>
    <div class="grid4" id="kpis"></div>
    <div class="card state-card" id="stateBox" style="margin-top:18px"></div>
  </section>

  <section id="staff">
    <div class="sec-head"><h2 id="hStaff">2 · Staff view</h2><span class="hint" id="hintStaff"></span></div>
    <div class="card">
      <div class="staff-body" id="staffBody"></div>
      <div class="tbl-wrap" id="taylorTbl" style="margin-top:16px"></div>
    </div>
  </section>

  <section id="leading" hidden>
    <div class="sec-head"><h2 id="hLeading">3 · Leading indicators</h2><span class="hint" id="hintLeading"></span></div>
    <div id="leadingBody"></div>
  </section>

  <section id="ust10y" hidden>
    <div class="sec-head"><h2 id="hUst10y">4 · 10Y Treasury: where the move comes from</h2><span class="hint" id="hintUst10y"></span></div>
    <div id="ust10yBody"></div>
  </section>

  <section id="nowcasts">
    <div class="sec-head"><h2 id="hNowcast">3 · Nowcasts</h2><span class="hint" id="hintNowcast"></span></div>
    <div class="legend-row" id="legend"></div>
    <div class="card">
      <div class="tbl-wrap" id="nowcastTbl"></div>
      <div class="notes" id="nowcastNote"></div>
    </div>
  </section>

  <section id="baseline">
    <div class="sec-head"><h2 id="hBaseline">4 · Baseline</h2><span class="hint" id="hintBaseline"></span></div>
    <div class="card">
      <div class="tbl-wrap" id="baselineTbl"></div>
      <div class="notes" id="baselineNote"></div>
    </div>
  </section>

  <section id="recent">
    <div class="sec-head"><h2 id="hRecent">5 · Key data since last update</h2><span class="hint" id="hintRecent"></span></div>
    <div class="card">
      <div class="tbl-wrap" id="recentTbl"></div>
      <div class="notes" id="recentNote"></div>
    </div>
  </section>

  <section id="calendar">
    <div class="sec-head"><h2 id="hCal">6 · Upcoming calendar</h2><span class="hint" id="hintCal"></span></div>
    <div class="card">
      <div class="tbl-wrap" id="calTbl"></div>
      <div class="notes" id="calNote"></div>
    </div>
  </section>

  <section id="charts" hidden>
    <div class="sec-head"><h2 id="hCharts">7 · Charts</h2><span class="hint" id="hintCharts"></span></div>
    <div class="chart-note" id="chartsNote" hidden></div>
    <div class="grid2" id="chartGrid"></div>
  </section>
</main>

<footer class="wrap">
  <div class="caveat" id="caveat">
    <h2 id="hCaveat">⚠ Datenlage und Quellen – Vorbehalte</h2>
    <div id="caveatBody"></div>
    <p class="fine" id="caveatFine"></p>
  </div>
  <div class="site-foot" id="siteFoot"></div>
</footer>

CB figures in the note date from fetches on 4–6 Nov and were not all re-fetched on 12 Nov.","nowcasts":[{"id":"gdp-q3","category":"GDP","variable":"Euro-area GDP, Q3 2026 flash, q/q","value":"0.4","unit":"%","quality":"V","status":"published flash","period":"Q3 2026","interval":"–","prior":"–","source":"Eurostat flash, 30 Oct 2026 (fetched 6 Nov)","as_of":"30 Oct 2026","rationale":"Official flash. The t+45 release on 13 Nov may revise Q3. Country detail: DE 0.2 (p), FR −0.1, IT 0.0, ES 0.6 (p), IE 5.5 (e) — all V, Eurostat."},{"id":"gdp-ex-ie","category":"GDP","variable":"Euro-area GDP excluding Ireland, Q3, q/q","value":"0.21","unit":"%","quality":"d","status":"derived","period":"Q3 2026","interval":"–","prior":"–","source":"Euro-area 21 minus Ireland levels (derived)","as_of":"6 Nov 2026","rationale":"Own calculation from official levels. Irish GDP is an estimate (e) and is volatile. Underlying growth is softer than the headline 0.4% flash."},{"id":"gdp-staff-q4","category":"GDP","variable":"Staff Q4 2026 GDP, q/q","value":"+0.2–0.3","unit":"%","quality":"d","status":"own estimate, unchanged","period":"Q4 2026","interval":"judgment ±0.3 pp","prior":"same (4 Nov note)","source":"Staff, 4 Nov note, unchanged 11 Nov","as_of":"11 Nov 2026","rationale":"Judgmental staff range. No new analysis in the 12 Nov update. Retail volume in September was weak (EA −0.7% m/m, V).","headline":true,"kpi_label":"Q4 GDP, staff","kpi_note":"Own estimate · unchanged since 4 Nov"},{"id":"gdp-2026","category":"GDP","variable":"Staff GDP 2026","value":"1.1","unit":"%","quality":"d","status":"own baseline","period":"2026","interval":"–","prior":"–","source":"Staff baseline, 4 Nov note (September MPE 0.9)","as_of":"4 Nov 2026","rationale":"Own baseline, compared with the September 2026 MPE of 0.9 (official ECB staff projections, V from an earlier fetch)."},{"id":"hicp-oct","category":"inflation","variable":"Euro-area HICP / HICPX, October flash, y/y","value":"4.0 / 2.5","unit":"%","quality":"V","status":"published flash","period":"Oct 2026","interval":"–","prior":"–","source":"Eurostat flash, 4 Nov 2026","as_of":"4 Nov 2026","rationale":"Official flash. HICPX 2.5% shows no second-round signal so far. The final October HICP is due 18 Nov.","headline":true,"kpi_label":"HICP Oct flash","kpi_note":"Eurostat, 4 Nov · V · HICPX 2.5%"},{"id":"hicp-q4","category":"inflation","variable":"Staff Q4 2026 HICP, y/y","value":"~3.8–3.9","unit":"%","quality":"d","status":"pending; baseline still ~4.0","period":"Q4 2026","interval":"judgment ±0.3 pp","prior":"Initial energy-check estimate 10 Nov was ~3.7","source":"Staff own estimate, reconciled 11 Nov","as_of":"11 Nov 2026","rationale":"Own estimate, still pending; the baseline table continues to show about 4.0 (4 Nov). Above the September MPE Q4 peak of 3.6 (V). The desk’s pass-through rule (0.3–0.5 pp per 10% in Brent) is unverified and, in the note, is described as likely too high at USD 90+.","headline":true,"kpi_label":"Q4 HICP, staff","kpi_note":"Own estimate ~3.8–3.9, pending · baseline still ~4.0"},{"id":"hicp-path","category":"inflation","variable":"Staff HICP / HICPX, 2026 and 2027","value":"HICP 3.1 / ~2.7–2.8; HICPX 2.4 / 2.7","unit":"%","quality":"d","status":"own baseline; 2027 HICP pending energy revision","period":"2026 / 2027","interval":"–","prior":"–","source":"Staff, 4 Nov note","as_of":"4 Nov 2026","rationale":"Own baselines. September 2026 MPE (V, earlier fetch): HICP 3.0 / 2.5 / 2.1; HICPX 2.5 / 2.6 / 2.3; Q4 peak 3.6. 2027 HICP is pending an energy revision."},{"id":"wages","category":"labour","variable":"ECB wage tracker","value":"H2-26 2.7; H1-27 2.8; Q3-27 2.41; Sep-27 2.18","unit":"%","quality":"V","status":"official tracker, 6 Nov fetch","period":"H2 2026 to Sep 2027","interval":"–","prior":"–","source":"ECB wage tracker, fetched 6 Nov","as_of":"6 Nov 2026, not re-fetched","rationale":"Official ECB series. The 12 Nov policy read notes the tracker easing into 2027. Consumer expectations (CES, Sep, V, 6 Nov): 1y 3.1 / 3y 2.9 / 5y 2.5."},{"id":"dfr","category":"policy","variable":"Deposit facility rate","value":"2.50","unit":"%","quality":"V","status":"unchanged vs 4 Nov policy read","period":"Current","interval":"–","prior":"2.50%","source":"Staff policy read, 4 Nov, unchanged 12 Nov","as_of":"12 Nov 2026","rationale":"Inflation outlook: above the September MPE near term, energy-driven, risks balanced to slightly up medium term. Underlying inflation: core stable or easing (German CPI core 2.1, U). Transmission: no new credit data since 27 Oct (NFC loans 4.2% in September). Market pricing: n/a, not fetched.","headline":true,"kpi_label":"Deposit facility","kpi_note":"2.50% · policy read unchanged vs 4 Nov"}],"baseline_hint":"Staff baselines from the 4 Nov note. Official column is the September 2026 ECB staff macroeconomic projections (MPE).","baseline_note":"Q4 HICP own estimate (~3.8–3.9) has not replaced the ~4.0 baseline. 2027 HICP is pending an energy revision. MPE figures are from an earlier primary fetch (V).","baseline":[{"variable":"Q4 2026 GDP, q/q","staff":"+0.2–0.3 — own estimate","previous":"same (4 Nov)","change":"0","official":"n/a in the 12 Nov note","quality":"d","source":"Staff, 4 Nov, unchanged 11 Nov","as_of":"11 Nov 2026"},{"variable":"GDP 2026","staff":"1.1 — own baseline","previous":"–","change":"–","official":"0.9 (Sept MPE)","quality":"d","source":"Staff, 4 Nov; MPE Sept 2026","as_of":"4 Nov 2026"},{"variable":"Q4 2026 HICP, y/y","staff":"baseline ~4.0; pending own view ~3.8–3.9","previous":"~4.0 (4 Nov)","change":"own view pending, baseline not reset","official":"Q4 peak 3.6 (Sept MPE)","quality":"d","source":"Staff 4 Nov / 11 Nov; MPE Sept 2026","as_of":"11 Nov 2026"},{"variable":"HICP 2026 / 2027","staff":"3.1 / ~2.7–2.8","previous":"–","change":"2027 pending energy revision","official":"3.0 / 2.5 (then 2.1 in 2028, Sept MPE)","quality":"d","source":"Staff, 4 Nov; MPE Sept 2026","as_of":"4 Nov 2026"},{"variable":"HICPX 2026 / 2027","staff":"2.4 / 2.7","previous":"–","change":"–","official":"2.5 / 2.6 (then 2.3 in 2028, Sept MPE)","quality":"d","source":"Staff, 4 Nov; MPE Sept 2026","as_of":"4 Nov 2026"}],"recent_hint":"Releases since 5 Nov that are in the Staff Desk files. Survey-consensus figures are omitted. National activity data from 5–11 Nov are not in the files.","recent_note":"German final HICP is from a search-index copy of the Destatis release (U). Energy prices are from a delayed secondary source (U). Retail-sales consensus was not on file and is not estimated.","recent_data":[{"release":"Euro-area retail volume, September","date":"Around 6 Nov 2026","quality":"V","actual":"EA −0.7% m/m; Germany −2.0% (p). Retail Q3 vs Q2 ≈ −0.48 (d).","prior":"–","why":"Soft consumption into Q4. Eurostat short-term statistics, fetched 6 Nov."},{"release":"German HICP final, October","date":"11 Nov 2026","quality":"U","actual":"HICP 2.8% y/y, −0.1% m/m (equal to the flash); CPI core 2.1 (from 2.4).","prior":"Flash 2.8% y/y","why":"Core eased. Taken from a search-index copy of Destatis PR 392; the live page timed out."},{"release":"Energy prices (secondary)","date":"11 Nov 2026, 17:34 / 17:10 CET","quality":"U","actual":"Brent 94.04 (+2.6% vs 10 Nov reference 91.63); TTF 86.53 (+1.9% vs 84.90).","prior":"10 Nov references 91.63 / 84.90","why":"Near-term HICP energy driver. Delayed secondary quotes, not a primary exchange settlement."}],"calendar_hint":"As listed in the 12 Nov note. Times not specified there are left blank.","calendar_note":"The t+45 GDP release on 13 Nov may revise the Q3 flash.","calendar":[{"date":"13 Nov 2026","event":"Euro-area GDP t+45 and employment","time":"–","why":"May revise the Q3 0.4% flash."},{"date":"18 Nov 2026","event":"Euro-area HICP final, October","time":"–","why":"Confirms or revises the 4.0% / 2.5% flash."},{"date":"20 Nov 2026","event":"Negotiated wages, Q3","time":"–","why":"Wage-pipeline cross-check."},{"date":"Around 23 Nov 2026","event":"Flash PMI","time":"–","why":"Timely activity and price-setting signal (not yet in this note)."},{"date":"26 Nov 2026","event":"Monetary developments","time":"–","why":"Credit and money; last NFC loan reading in the note is 4.2% in September, as of 27 Oct."},{"date":"1 Dec 2026","event":"Euro-area HICP flash, November","time":"–","why":"Next inflation print."},{"date":"16–17 Dec 2026","event":"Governing Council and December BMPE","time":"–","why":"Policy decision and new staff projections."}],"staff_hint":"Policy read unchanged versus 4 Nov. Staff view, not the Governing Council or ECB staff projections.","staff_view":{"lead":"Bottom line from the 12 Nov note: growth about +0.2–0.3% q/q in Q4 (own estimate); headline inflation past the oil peak, with a pending own Q4 view of about 3.8–3.9% against a baseline still around 4.0, and no second-round core signal so far.","bullets":["Growth: Q3 flash 0.4% (V) is flattered by Ireland (ex-Ireland 0.21, d). Staff Q4 is +0.2–0.3 (own estimate). September retail volume was weak.","Inflation: October HICP flash 4.0% (V) sits above the September MPE Q4 peak of 3.6. The pending own Q4 view (~3.8–3.9) has not replaced the ~4.0 baseline. HICPX 2.5% (V) and German CPI core 2.1 (U) show no second-round signal so far.","Wages and expectations: ECB wage tracker easing into 2027 (V, 6 Nov). CES September: 1y 3.1 / 3y 2.9 / 5y 2.5 (V).","Energy: Brent and TTF quotes on 11 Nov were slightly higher than the 10 Nov references (U, delayed secondary).","Coverage gap: national activity data and surveys from 5–11 Nov are not in the Staff Desk files."],"policy":"Deposit facility rate 2.50%. Inflation outlook: above the September MPE near term, energy-driven, risks balanced to slightly up medium term. Underlying inflation: core stable or easing. Transmission: no new credit data since 27 Oct (NFC loans 4.2% in September). Market pricing: n/a, not fetched. Policy read unchanged versus 4 Nov."},"charts_hint":"Wage tracker: ECB Data Portal series fetched 6 Nov 2026 (press release 4 Nov). Backtest: inflation-nowcast model, 6 Nov 2026, pseudo out-of-sample, current vintage (not real-time).","charts":[{"file":"charts/ecb_wage_tracker_2026-11-06.png","wide":true,"title":"ECB Forward-Looking Wage Tracker","subtitle":"Euro-area negotiated wages, annual rate of change, including and excluding one-off payments. Forward-looking observations (E) are the ECB wage tracker’s own path, not a staff forecast; they are revisable as coverage rises (September 2027 coverage 22.9%).","caption":"Source: ECB Data Portal, series EWT.M.U2.N.WT.INWS._T.4F0.GY (headline, including one-offs), EWT.M.U2.N.WT.INWX._T.4F0.GY (excluding one-offs) and EWT.M.U2.N.WT.COVR._T.4F0._Z (coverage). ECB press release 4 Nov 2026 (agreements to mid-October 2026). Fetched 6 Nov 2026; not re-fetched for this page. As of 6 Nov 2026. The path points H2 2026 2.7%, H1 2027 2.8%, Q3 2027 2.41% and September 2027 2.18% are those already cited by the ECB Staff Desk (averages of the monthly headline series; the press release rounds the Q3 2027 average to 2.4%). Quality: V."},{"file":"charts/ea_hicp_nowcast_vs_actual_2026-11-06.png","wide":true,"title":"Euro-area HICP nowcast vs actual — pseudo out-of-sample backtest","subtitle":"Staff inflation-nowcast model, current vintage (not real-time). Full sample shown (February 2023–October 2026, n=45). This is the model’s historical error, not a track record of the staff-judgment nowcasts in the table above.","caption":"Source: staff inflation-nowcast model, already-produced pseudo out-of-sample backtest (current vintage, not real-time). As of 6 Nov 2026, 10:46 Europe/Zurich (report timestamp 2026-11-06T09:46:12Z). Actuals: Eurostat HICP, current vintage, non-seasonally adjusted, percent month-on-month. The chart is drawn from the already-produced step file; RMSE, MAE and related figures are taken from the already-produced backtest report (same rounding) and its summary JSON. No new model was estimated. Euro-area I25 history is short; the sample starts in 2023. Headline, core and food use a deseasonalised AR(1) plus a month seasonal (production-aligned); energy uses a fuels bridge. A seasonal naïve benchmark has a slightly lower RMSE than the model for headline (0.302 vs 0.318) and for core (0.198 vs 0.214), as already recorded in the backtest report. A quasi-real-time evaluation against Flash releases was also produced (n=10) and was marked in that report as not meaningful because n is below 12; it is not shown. Quality of error statistics: (d).","stats":[{"series":"Headline, NSA","n":"45","rmse":"0.318","mae":"0.270","rw_rmse":"0.497","seasonal_rmse":"0.302","dir_hit":"82.2%","cov80":"90.5%","unit":"pp m/m","quality":"(d)"},{"series":"Core, NSA","n":"45","rmse":"0.214","mae":"0.174","rw_rmse":"0.760","seasonal_rmse":"0.198","dir_hit":"97.8%","cov80":"77.8%","unit":"pp m/m","quality":"(d)"},{"series":"Food, NSA","n":"45","rmse":"0.361","mae":"0.237","rw_rmse":"0.379","seasonal_rmse":"0.422","dir_hit":"82.2%","cov80":"77.8%","unit":"pp m/m","quality":"(d)"},{"series":"Energy, NSA","n":"45","rmse":"1.258","mae":"0.941","rw_rmse":"2.068","seasonal_rmse":"2.323","dir_hit":"80.0%","cov80":"85.7%","unit":"pp m/m","quality":"(d)"}],"note":"Units are percentage points, month-on-month, not seasonally adjusted. Coverage of 80% uses full-sample error quantiles (informative, not expanding sequential bands), as stated in the backtest report."}],"charts_note":"","caveats":["Report date 12 Nov 2026, ~07:50 CET; data cut-off 11 Nov 2026, 17:55 CET. Update of existing notes only; no new analysis. (d) = derived; own estimate = staff judgment, about ±0.3 pp as stated in the note; V = verified from a primary source this cycle; U = unverified or secondary.","Q4 HICP of about 3.8–3.9% is an own estimate and is still pending; the baseline remains about 4.0 (4 Nov). The energy pass-through rule used in earlier work (0.3–0.5 pp per 10% in Brent) is unverified and, in the note, is described as likely too high at USD 90+.","Energy prices come from a delayed secondary source (U). The German final HICP is from a search-index copy of Destatis PR 392 (U); the live page timed out.","Euro-area GDP excluding Ireland and retail Q3 are derived (d). The Irish GDP figure is an estimate (e) and is volatile. The t+45 GDP release on 13 Nov may revise Q3.","Eurostat and ECB figures (wages, CES, national accounts) date from fetches on 4–6 Nov and were not re-fetched on 12 Nov.","Release coverage gap: national activity data and surveys from 5–11 Nov are not in the Staff Desk files and were not fetched. Survey-consensus values are not shown and, in the note, were missing for every release since 5 Nov other than one item omitted here.","The euro-area HICP nowcast-versus-actual chart and its error statistics come from the staff inflation-nowcast model’s already-produced pseudo out-of-sample backtest of 6 Nov 2026, 10:46 Europe/Zurich (current vintage, not real-time; n=45; ends at October 2026). It is not a track record of the staff-judgment nowcasts in the table. A seasonal naïve benchmark has a slightly lower RMSE than the model for headline and core, as already recorded in that report. The wage-tracker chart uses the ECB Data Portal series fetched on 6 Nov 2026 (press release 4 Nov 2026) and was not re-fetched; forward-looking observations (E) are the ECB’s path, not a staff forecast, and are revisable as coverage rises.","Leading-indicator charts on this page are as of 12 Nov 2026, 18:41 Europe/Zurich, from the ECB Staff Desk note leading_indicators_2026-11-12.md. They were not part of the 07:50 cutoff. Every chart carries “Staff view, not ECB staff projections.”","Computed leading-indicator figures are (d) and pseudo-real-time: Pearson correlations and expanding-window forecasts on final vintages, not a real-time vintage panel. Correlation is not causation.","October 2026 HICP (headline, HICPX, services, NEIG) is the flash (flag e); the final is due on 18 November 2026.","The AAA 10y–3m spread is kept as a recession-risk indicator, not a growth lead (staff decision, 12 Nov 2026, 19:31 Europe/Zurich). The linear test versus mean GDP growth is a null: no usable lead, wrong sign at lag 0 (r=−0.145), out-of-sample RMSE ratios 1.10–1.20 (worse than an AR). A recession probit versus CEPR dates is not yet tested (n/a).","The wage tracker, ESI and Indeed Hiring Lab posted-wage tracker are labelled coincident/diagnostic, not leading."],"excluded":[{"item":"A third-party euro-area GDP nowcast tracker","reason":"Marked internal-only by the ECB Staff Desk; figures and the path are not shown."},{"item":"Survey-consensus figures and surprise-versus-consensus calculations","reason":"Consensus values are not published here."},{"item":"Private business-survey (PMI) figures","reason":"Licensed survey data are not shown on this public page."},{"item":"Licensed bank, broker and private-survey datasets","reason":"Internal-use or licensed material is not shown."},{"item":"EURIBOR (any tenor)","reason":"Published on the ECB Data Portal, but TITLE_COMPL names Refinitiv as the provider of the benchmark. Not used on this public page. The AAA 3-month spot, or €STR, is the short leg."},{"item":"GSCPI (NY Fed)","reason":"Internal only, pending NY Fed data-notice clearance, and not shown on this public page."}],"gaps":["National activity and survey releases from 5–11 Nov are not covered.","Q4 HICP own estimate is pending and has not replaced the ~4.0 baseline.","2027 HICP is pending an energy revision.","Market pricing was not fetched (n/a).","No unemployment nowcast is in the 12 Nov note; labour is represented by the wage tracker and CES."],"leading_indicators":{"hint":"Staff charts and staff reads. As of 12 Nov 2026, 18:41 Europe/Zurich. Source: leading_indicators_2026-11-12.md. Public sources only. Staff view, not ECB staff projections.","as_of":"2026-11-12T18:41:00+01:00","as_of_display":"12 Nov 2026, 18:41 Europe/Zurich","source":"leading_indicators_2026-11-12.md","note":"Staff view, not ECB staff projections. Computed figures are (d) and pseudo-real-time (final vintages, not a real-time vintage panel). October 2026 HICP is the flash; the final is due on 18 November. A recession probit of the AAA 10y–3m spread versus CEPR dates is not yet tested (n/a).","blocks":[{"id":"inflation","title":"Inflation","read":"Services selling-price expectations lead HICP services by 6 months (r=+0.799); excluding 2020–23 the best lag is 10 months (r=+0.636). Industry selling-price expectations lead HICP NEIG by 10 months (r=+0.822); excluding 2020–23 the lead is pandemic-sensitive (k=12, r=+0.308). Extra-EA import prices, CPA B–D, have a measured 9–10 month lead versus NEIG (d). The ECB wage tracker is coincident/diagnostic, not leading: versus HICP services, k=0, r=+0.881, and out of sample it is worse than an AR. October 2026 HICP is the flash; the final is due on 18 November.","charts":[{"file":"charts/ea_spe_services.png","title":"Selling-price expectations in services: leading indicator","caption":"Role: leading. European Commission BCS, services selling-price expectations (next 3 months), euro area (EA21), advanced 6 months versus HICP services inflation (d, full-sample expected-sign best lag). Unit: Balance (SPE); annual % change (HICP services). Source: European Commission BCS via Eurostat; Eurostat HICP; staff calculations (d). As of: 12 Nov 2026, 18:41 Europe/Zurich. Full-sample lead k=6, r=+0.799 (n=277); ex-2020–23: k=10, r=+0.636. OOS RMSE ratios vs an AR of services inflation: 0.850 at 3 months (p=0.008) and 0.770 at 6 months (p=0.039). Services SPE history on EA21 starts April 2003. October 2026 HICP services is the flash (e); the final is due on 18 November. Staff view, not ECB staff projections.","width":2400,"height":1650},{"file":"charts/ea_spe_industry.png","title":"Selling-price expectations in industry: leading indicator","caption":"Role: leading. European Commission BCS, industry selling-price expectations (next 3 months), euro area (EA21), advanced 10 months versus HICP non-energy industrial goods (NEIG) inflation (d, full-sample expected-sign best lag). Unit: Balance (SPE); annual % change (NEIG). Source: European Commission BCS via Eurostat; Eurostat HICP; staff calculations (d). As of: 12 Nov 2026, 18:41 Europe/Zurich. Full-sample lead k=10, r=+0.822 (n=311); ex-2020–23: k=12, r=+0.308 (still rising at k=12; the full-sample lead is pandemic-inflated). OOS RMSE ratios vs an AR of NEIG: 0.765 at 3 months (p=0.005) and 0.666 at 6 months (p=0.048). October 2026 NEIG is the flash (e); the final is due on 18 November. Staff view, not ECB staff projections.","width":2400,"height":1650},{"file":"charts/ea_import_prices.png","title":"Extra-euro-area industrial import prices: leading indicator","caption":"Role: leading. Extra-EA import prices, CPA B–D, year-on-year, euro area (EA21), advanced 10 months versus HICP NEIG inflation (d, full-sample expected-sign best lag). Unit: Annual % change. Source: Eurostat; staff calculations (d). As of: 12 Nov 2026, 18:41 Europe/Zurich. Full-sample lead k=10, r=+0.744 (n=240); ex-2020–23: k=9, r=+0.421. OOS RMSE ratios vs an AR of NEIG: 0.751 at 3 months (p=0.013) and 0.633 at 6 months (p=0.079). Last import-price observation: September 2026 = 12.7% (October empty); no interpolation. October 2026 NEIG is the flash (e); the final is due on 18 November. Staff view, not ECB staff projections.","width":2400,"height":1650},{"file":"charts/ea_wage_tracker.png","title":"ECB wage tracker (negotiated wages, including one-offs): coincident/diagnostic","caption":"Role: coincident/diagnostic, not leading. Headline INWS, 12-month smoothed, euro area (U2). The backward tracker (observation status A and P only) is shown unshifted against HICP services inflation. Forward (status E) observations are not plotted and were not used in the tests. Unit: Annual % change. Source: ECB Data Portal (EWT); Eurostat HICP; staff calculations (d). As of: 12 Nov 2026, 18:41 Europe/Zurich. Coincident: vs employment expectations (next 12 months): leading indicator","caption":"Role: leading. European Commission BCS consumer unemployment expectations, euro area (EA21), advanced 12 months versus the unemployment rate (d, ex-2020–23 expected-sign best lag). The full-sample signed best lag is 9 months (see footnote). Dual axis. Unit: Balance (UE-NY); % of the labour force (unemployment, SA). Source: European Commission BCS via Eurostat; Eurostat labour force; staff calculations (d). As of: 12 Nov 2026, 18:41 Europe/Zurich. The chart uses k=12, the ex-2020–23 expected-sign best lag (r=+0.520). Full-sample signed best lag is k=9, r=+0.412. OOS RMSE ratios vs an AR of the unemployment rate: 0.852 at 1 month (p=0.072) and 0.867 at 3 months (p=0.331) — a weaker OOS gain than EEI or industry employment expectations, and not statistically significant at conventional levels at h=3. Last unemployment observation: September 2026 = 6.5%. Staff view, not ECB staff projections.","width":2400,"height":1650},{"file":"charts/ea_ieme.png","title":"Industry employment expectations: leading indicator","caption":"Role: leading. European Commission BCS industry employment expectations (a component of the EEI), euro area (EA21), advanced 11 months versus the unemployment rate (d, full-sample expected-sign best lag). Dual axis. Unit: Balance (IEME); % of the labour force (unemployment, SA). Source: European Commission BCS via Eurostat; Eurostat labour force; staff calculations (d). As of: 12 Nov 2026, 18:41 Europe/Zurich. Full-sample lead k=11, r=−0.413. OOS RMSE ratios vs an AR of the unemployment rate: 0.716 at 3 months (p=0.007), 0.728 at 6 months (p=0.001) and 0.824 at 12 months (p=0.019). Last unemployment observation: September 2026 = 6.5%. Staff view, not ECB staff projections.","width":2400,"height":1650},{"file":"charts/ea_indeed_wages.png","title":"Indeed Hiring Lab posted-wage tracker: coincident/diagnostic","caption":"Role: coincident/diagnostic, not leading. Euro-area aggregate (Hi function qs(id){ return document.getElementById(id); }
function esc(s){
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
}
function qClass(q){
  const t = String(q || "").trim();
  if (t === "V") return "V";
  if (t === "U") return "U";
  return "d";
}
function qBadge(q){
  const t = String(q || "").trim() || "U";
  const cls = qClass(t);
  const label = (t === "(d)" || t === "d" || cls === "d") && t !== "V" && t !== "U" ? "(d)" : t;
  return `<span class="q ${cls}" title="Data quality">${esc(label)}</span>`;
}
function statusPill(s){
  if (!s) return "";
  const raw = String(s);
  const k = raw.toLowerCase();
  let cls = "";
  if (/(missing|fehlt|veraltet|stale)/.test(k)) cls = "missing";
  else if (/(pending|ausstehend)/.test(k)) cls = "pending";
  else if (/(retained|beibehalten|updated|aktualisiert)/.test(k)) cls = "retained";
  else if (/(own|urteil|schätzung|estimate)/.test(k)) cls = "own";
  return ` <span class="pill ${cls}">${esc(raw)}</span>`;
}
function fmtWhen(iso, lang){
  if (!iso) return "–";
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) {
    const [y,m,d] = iso.split("-");
    if (lang === "de") {
      const months = ["Jan.","Feb.","März","Apr.","Mai","Juni","Juli","Aug.","Sep.","Okt.","Nov.","Dez."];
      return `${Number(d)}. ${months[Number(m)-1]} ${y}`;
    }
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return `${Number(d)} ${months[Number(m)-1]} ${y}`;
  }
  const d = new Date(iso);
  if (isNaN(d)) return String(iso);
  const loc = lang === "de" ? "de-CH" : "en-GB";
  const fmt = new Intl.DateTimeFormat(loc, {
    timeZone: "Europe/Zurich",
    day: "numeric", month: "short", year: "numeric",
    hour: "2-digit", minute: "2-digit", hour12: false
  });
  return fmt.format(d).replace(",", "") + " Europe/Zurich";
}
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  try { localStorage.setItem(THEME_KEY, t); } catch(e){}
  const lang = document.documentElement.lang === "de" ? "de" : "en";
  const L = I18N[lang];
  qs("themeLbl").textContent = t === "dark" ? L.light : L.dark;
}
function initTheme(){
  let t = "light";
  try { t = localStorage.getItem(THEME_KEY) || t; } catch(e){}
  setTheme(t);
}

  const rows = (data.nowcasts || []).filter(r => r.headline);

        ${qBadge(r.quality)}
      </div>
      <div class="big">${esc(r.value)}${r.unit ? `<small>${esc(r.unit)}</small>` : ""}</div>

function groupRows(rows, lang){
  const L = I18N[lang] || I18N.en;
  const order = ["GDP","inflation","labour","policy"];
  const groups = [];
  const seen = new Set();
  for (const key of order) {
    const g = rows.filter(r => r.category === key);
    if (g.length) { groups.push({key, label: L.category[key] || key, rows:g}); seen.add(key); }
  }
  const rest = rows.filter(r => !seen.has(r.category));
  if (rest.length) groups.push({key:"other", label:"", rows:rest});
  return groups;
}

    </tr>`;
  }
  html += `</tbody></table>`;
  qs("calTbl").innerHTML = html;
  qs("calNote").textContent = data.calendar_note || "";
}

function renderStaff(data){
  const sv = data.staff_view || {};
  let html = "";
  if (sv.lead) html += `<p>${esc(sv.lead)}</p>`;
  if (sv.bullets && sv.bullets.length) {
    html += "<ul>" + sv.bullets.map(b => `<li>${esc(b)}</li>`).join("") + "</ul>";
  }
  if (sv.policy) html += `<p>${esc(sv.policy)}</p>`;
  qs("staffBody").innerHTML = html || `<p class="muted">–</p>`;
  const t = sv.taylor;
  if (t && (t.rows || t.note || t.result)) {
    let th = `<table><thead><tr><th>${esc(t.title || "Taylor-type diagnostic (d)")}</th><th>Assumptions / inputs</th><th class="r">Result</th></tr></thead><tbody>`;
    const rows = t.rows || [{inputs: t.assumptions || "", result: t.result || ""}];
    for (const r of rows) {
      th += `<tr><td>${esc(r.label || t.note || "Own calculation, not an optimal-policy estimate")}</td><td>${esc(r.inputs || t.assumptions || "")}</td><td class="r">${esc(r.result || t.result || "")}${qBadge("d")}</td></tr>`;
    }
    th += `</tbody></table>`;
    qs("taylorTbl").innerHTML = th;
  } else {
    qs("taylorTbl").innerHTML = "";
  }
}

function renderChartStats(c, L){
  const rows = c.stats || [];
  if (!rows.length) return "";
  const cols = [
    ["series", L.colVariable],
    ["n", L.colN],
    ["rmse", L.colRmse],
    ["mae", L.colMae],
    ["rw_rmse", L.colRw],
    ["seasonal_rmse", L.colSeas],
    ["dir_hit", L.colDir],
    ["cov80", L.colCov],
    ["unit", L.colUnit]
  ];
  const used = cols.filter(([k]) => rows.some(r => r[k] != null && r[k] !== ""));
  let html = `<div class="tbl-wrap chart-stats"><table><thead><tr>`;
  for (const [,lab] of used) html += `<th>${esc(lab)}</th>`;
  html += `</tr></thead><tbody>`;
  for (const r of rows) {
    html += "<tr>";
    for (const [k] of used) {
      const cls = k === "series" ? "" : " class=\"r\"";
      html += `<td${cls}>${esc(r[k] ?? "")}${k==="rmse" && r.quality ? qBadge(r.quality) : ""}</td>`;
    }
    html += "</tr>";
  }
  html += "</tbody></table></div>";
  return html;
}

function renderCharts(data, L){
  const charts = data.charts || [];
  const note = data.charts_note || "";
  const sec = qs("charts");
  if (!charts.length && !note) { sec.hidden = true; return; }
  sec.hidden = false;
  qs("chartGrid").innerHTML = charts.map(c => {
    const img = c.file ? `<img class="chart-img" src="${esc(c.file)}" alt="${esc(c.title)}" width="1600" height="900">` : "";
    const sub = c.subtitle ? `<div class="sub" style="margin:4px 0 12px">${esc(c.subtitle)}</div>` : "";
    const cap = c.caption ? `<div class="cap-line">${esc(c.caption)}</div>` : "";
    const cnote = c.note ? `<div class="notes">${esc(c.note)}</div>` : "";
    return `<div class="card${c.wide ? " wide" : ""}">
      <h3>${esc(c.title || "")}</h3>
      ${sub}${img}${renderChartStats(c, L)}${cnote}${cap}
    </div>`;
  }).join("");
  const noteEl = qs("chartsNote");
  if (note) {
    noteEl.hidden = false;
    const paras = String(note).split("\n").filter(Boolean);
    noteEl.innerHTML = paras.map(p => `<p>${esc(p)}</p>`).join("");
  } else {
    noteEl.hidden = true;
    noteEl.innerHTML = "";
  }
}

function chartCard(c, L){
  const title = c.title || "";
  const w = c.width || 2400;
  const h = c.height || 1650;
  const img = c.file
    ? `<a class="chart-link" href="${esc(c.file)}" target="_blank" rel="noopener"><img class="chart-img" src="${esc(c.file)}" alt="${esc(title)}" width="${esc(w)}" height="${esc(h)}" loading="lazy"></a>`
    : "";
  const cap = c.caption ? `<div class="cap-line">${esc(c.caption)}</div>` : "";
  const cnote = c.note ? `<div class="${c.stale ? "stale-note" : "notes"}">${esc(c.note)}</div>` : "";
  const kind = c.companion ? ` <span class="pill">${esc(L.companion || "Companion")}</span>` : "";
  const stale = c.stale ? ` <span class="pill pending">STALE</span>` : "";
  return `<div class="card${c.wide ? " wide" : ""}">
    <h3>${esc(title)}${kind}${stale}</h3>
    ${img}${cnote}${cap}
  </div>`;
}

function renderBlockSection(secId, bodyId, hintId, bundle, L){
  const sec = qs(secId);
  if (!bundle || !(bundle.blocks && bundle.blocks.length) && !bundle.read) {
    sec.hidden = true;
    return;
  }
  sec.hidden = false;
  qs(hintId).textContent = bundle.hint || "";
  const intro = bundle.read
    ? `<p class="lead-read">${esc(bundle.read)}</p>`
    : (bundle.note ? `<p class="notes" style="margin:0 0 18px">${esc(bundle.note)}</p>` : "");
  const blocks = (bundle.blocks || []).map(b => {
    const bid = b.id ? ` id="${esc(secId)}-${esc(b.id)}"` : "";
    const read = b.read ? `<p class="lead-read">${esc(b.read)}</p>` : "";
    const grid = `<div class="lead-grid">` + (b.charts || []).map(c => chartCard(c, L)).join("") + `</div>`;
    return `<div class="lead-block"${bid}>
      <h3 class="lead-block-title">${esc(b.title || "")}</h3>
      ${read}${grid}
    </div>`;
  }).join("");
  qs(bodyId).innerHTML = intro + blocks;
}

function renderLeading(data, L){
  const li = data.leading_indicators;
  const sec = qs("leading");
  if (!li || !(li.blocks && li.blocks.length)) {
    sec.hidden = true;
    sec.removeAttribute("aria-label");
    return;
  }
  sec.hidden = false;
  qs("hintLeading").textContent = li.hint || "";
  const intro = li.note ? `<p class="notes" style="margin:0 0 18px">${esc(li.note)}</p>` : "";
  qs("leadingBody").innerHTML = intro + li.blocks.map(b => {
    const bid = b.id ? ` id="leading-${esc(b.id)}"` : "";
    const read = b.read ? `<p class="lead-read">${esc(b.read)}</p>` : "";
    const grid = `<div class="lead-grid">` + (b.charts || []).map(c => chartCard(c, L)).join("") + `</div>`;
    return `<div class="lead-block"${bid}>
      <h3 class="lead-block-title">${esc(b.title || "")}</h3>
      ${read}${grid}
    </div>`;
  }).join("");
}

function renderCaveats(data, L){
  const bits = [];
  const caveats = data.caveats || [];
  if (caveats.length) {
    bits.push("<ul>" + caveats.map(c => `<li>${esc(c)}</li>`).join("") + "</ul>");
  }
  const excl = data.excluded || [];
  if (excl.length) {
    bits.push(`<h3>${esc(L.excluded)}</h3><ul>` + excl.map(e => {
      const item = typeof e === "string" ? e : e.item;
      const reason = typeof e === "string" ? "" : e.reason;
      return `<li>${esc(item)}${reason ? " — " + esc(reason) : ""}</li>`;
    }).join("") + "</ul>");
  }
  const gaps = data.gaps || [];
  if (gaps.length) {
    bits.push(`<h3>${esc(L.gaps)}</h3><ul>` + gaps.map(g => `<li>${esc(g)}</li>`).join("") + "</ul>");
  }
  qs("caveatBody").innerHTML = bits.join("") || `<p>${esc(L.empty)}</p>`;
  qs("caveatFine").textContent = L.fine;
}

function render(data){
  const lang = data.lang === "de" ? "de" : "en";
  document.documentElement.lang = lang;
  const L = I18N[lang];
  document.title = data.title || data.bot?.name || "Staff Desk";
  qs("brandTitle").textContent = data.short_title || data.bot?.name || "Staff Desk";
  qs("brandSub").textContent = data.subtitle || "";
  qs("lblAsOf").textContent = L.asOf;
  qs("lblSrc").textContent = L.source;
  qs("lblFresh").textContent = L.freshness;
  qs("asOf").textContent = data.as_of_display || fmtWhen(data.as_of, lang);
  qs("srcFile").textContent = (data.source && data.source.label) || "–";
  const fr = data.freshness || {};
  qs("freshText").textContent = fr.label || "–";
  qs("freshDot").className = "dot " + (fr.dot || "amber");
  const banner = qs("banner");
  if (fr.banner) {
    banner.hidden = false;
    banner.className = "banner " + (fr.dot === "red" ? "very-stale" : "stale");
    banner.innerHTML = fr.banner;
  } else {
    banner.hidden = true;
  }
  qs("nav").innerHTML = navHtml(data.desk, L);
  const theme = document.documentElement.getAttribute("data-theme") || "light";
  qs("themeLbl").textContent = theme === "dark" ? L.light : L.dark;

  qs("hSummary").textContent = L.summary;
  qs("hNowcast").textContent = L.nowcast;
  qs("hBaseline").textContent = L.baseline;
  qs("hRecent").textContent = L.recent;
  qs("hCal").textContent = L.cal;
  qs("hStaff").textContent = L.staff;
  qs("hCharts").textContent = L.charts;
  qs("hCaveat").textContent = L.caveat;
  qs("hintQuality").textContent = L.qualityHint;
  qs("hintNowcast").textContent = data.nowcast_hint || "";
  qs("hintBaseline").textContent = data.baseline_hint || "";
  qs("hintRecent").textContent = data.recent_hint || "";
  qs("hintCal").textContent = data.calendar_hint || "";
  qs("hintStaff").textContent = data.staff_hint || "";
  qs("hintCharts").textContent = data.charts_hint || "";
  qs("hintLeading").textContent = (data.leading_indicators && data.leading_indicators.hint) || "";
  qs("hintUst10y").textContent = (data.ust10y_decomposition && data.ust10y_decomposition.hint) || "";

  const hasLeading = !!(data.leading_indicators && (data.leading_indicators.blocks || []).length);
  const hasUst = !!(data.ust10y_decomposition && ((data.ust10y_decomposition.blocks || []).length || data.ust10y_decomposition.read));
  if (hasLeading || hasUst) {
    const labels = lang === "de"
      ? { leading:"Leitindikatoren", ust10y:"10J-Treasury: woher die Bewegung kommt",
          nowcast:"Nowcasts", baseline:"Ausgangslage", recent:"Daten seit dem letzten Stand",
          cal:"Kalender", charts:"Grafiken" }
      : { leading:"Leading indicators", ust10y:"10Y Treasury: where the move comes from",
          nowcast:"Nowcasts", baseline:"Baseline", recent:"Key data since last update",
          cal:"Upcoming calendar", charts:"Charts" };
    const seq = [];
    if (hasLeading) seq.push(["hLeading", labels.leading]);
    if (hasUst) seq.push(["hUst10y", labels.ust10y]);
    seq.push(["hNowcast", labels.nowcast], ["hBaseline", labels.baseline],
             ["hRecent", labels.recent], ["hCal", labels.cal], ["hCharts", labels.charts]);
    // Current state and Staff view stay 1 and 2; extra sections start at 3.
    seq.forEach((pair, i) => { qs(pair[0]).textContent = `${i + 3} · ${pair[1]}`; });
  }

  qs("legend").innerHTML = `
    <span class="q V">V</span> ${esc(L.legendV)}
    <span class="q U">U</span> ${esc(L.legendU)}
    <span class="q d">(d)</span> ${esc(L.legendD)}
    <span class="pill own">${esc(L.legendOwn)}</span>`;

  renderKpis(data);
  const sum = data.summary || {};
  qs("stateBox").innerHTML = `
    <div class="ov-head">
      <div class="ov-title"><b>${esc(sum.heading || (lang==="de" ? "Aktueller Stand" : "Current state"))}</b>
      <span>${esc(sum.source || "")}</span></div>
    </div>
    <div class="state-text">${esc(sum.text || "")}</div>
    <div class="state-src">${esc(sum.as_of ? (lang==="de"?"Stand: ":"As of: ") + (data.as_of_display || fmtWhen(sum.as_of, lang)) : "")}</div>`;

  renderNowcasts(data, L, lang);
  renderBaseline(data, L);
  renderRecent(data, L);
  renderCal(data, L);
  renderStaff(data);
  renderCharts(data, L);
  renderLeading(data, L);
  renderBlockSection("ust10y", "ust10yBody", "hintUst10y", data.ust10y_decomposition, L);
  renderCaveats(data, L);

  const home = `<a href="../">${esc(L.home)}</a> · <a href="../ai-token/">${esc(L.ai)}</a> · <a href="../staff/">${esc(L.staffHome)}</a>`;
  qs("siteFoot").innerHTML = `${esc(L.foot)} · ${home}`;
}

async function load(){
  let data = EMBEDDED;
  try {
    const r = await fetch("data/desk.json", {cache:"no-store"});
    if (r.ok) data = await r.json();
  } catch (e) {}
  if (!data) {
    qs("app").innerHTML = `<p class="notice">No desk data loaded.</p>`;
    return;
  }
  render(data);
}
qs("themeBtn").addEventListener("click", () => {
  const cur = document.documentElement.getAttribute("data-theme") === "dark" ? "dark" : "light";
  setTheme(cur === "dark" ? "light" : "dark");
});
initTheme();
load();
</script>
</body>
</html>
